# Publishes site/ to GitHub Pages. The page is plain static HTML with no build
# step, so the job just uploads the directory.
#
# Pages must already be enabled on the repo with Actions as the build source
# (done via the API: POST /repos/:owner/:repo/pages -f build_type=workflow).
# configure-pages 404s otherwise, and it cannot enable Pages itself — the
# default GITHUB_TOKEN lacks the scope to create a Pages site.
name: pages

on:
    push:
        branches: [main]
        paths:
            - "site/**"
            - "scripts/build-docs.ts"
            - ".github/workflows/pages.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Never run two deploys at once, and let an in-flight one finish rather than
# cancelling it — a cancelled deploy can leave Pages on a half-published state.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4

            - id: configure
              uses: actions/configure-pages@v5

            # The guide is authored as markdown in site/docs/ and rendered to
            # static HTML here, so the published pages need no JS and the
            # committed tree keeps only the sources.
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Render docs
              run: bun scripts/build-docs.ts

            # .nojekyll stops Pages from running the content through Jekyll,
            # which would drop any file or directory starting with an underscore.
            - name: Disable Jekyll processing
              run: touch site/.nojekyll

            # og:image must be an absolute URL — crawlers cannot resolve a
            # relative one. Injecting the deployment origin here keeps the
            # domain out of the committed HTML.
            - name: Inject deployment origin
              env:
                  BASE_URL: ${{ steps.configure.outputs.base_url }}
              run: |
                  if [ -z "$BASE_URL" ]; then
                      echo "configure-pages did not report a base_url" >&2
                      exit 1
                  fi
                  # Trailing slash would double up against the "/og.png" suffix.
                  base="${BASE_URL%/}"
                  # Every page carries the placeholder, not just the landing
                  # page — each doc page has its own og:url.
                  find site -name '*.html' -print0 | xargs -0 sed -i "s#__SITE_URL__#${base}#g"
                  echo "site URL: $base"

                  if grep -rq '__SITE_URL__' site; then
                      echo "placeholder left unreplaced" >&2
                      exit 1
                  fi

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site

            - id: deployment
              uses: actions/deploy-pages@v4
