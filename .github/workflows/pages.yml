# Publishes site/ to GitHub Pages. The page is plain static HTML with no build
# step, so the job just uploads the directory.
#
# No manual setup needed: configure-pages runs with `enablement: true`, which
# turns Pages on and points it at Actions the first time this runs. Without it
# the step 404s on a repo that has never had Pages enabled.
name: pages

on:
    push:
        branches: [main]
        paths:
            - "site/**"
            - ".github/workflows/pages.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Never run two deploys at once, and let an in-flight one finish rather than
# cancelling it — a cancelled deploy can leave Pages on a half-published state.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4

            - id: configure
              uses: actions/configure-pages@v5
              with:
                  # Create the Pages site if the repo has none yet.
                  enablement: true

            # .nojekyll stops Pages from running the content through Jekyll,
            # which would drop any file or directory starting with an underscore.
            - name: Disable Jekyll processing
              run: touch site/.nojekyll

            # og:image must be an absolute URL — crawlers cannot resolve a
            # relative one. Injecting the deployment origin here keeps the
            # domain out of the committed HTML.
            - name: Inject deployment origin
              env:
                  BASE_URL: ${{ steps.configure.outputs.base_url }}
              run: |
                  if [ -z "$BASE_URL" ]; then
                      echo "configure-pages did not report a base_url" >&2
                      exit 1
                  fi
                  # Trailing slash would double up against the "/og.png" suffix.
                  base="${BASE_URL%/}"
                  sed -i "s#__SITE_URL__#${base}#g" site/index.html
                  echo "site URL: $base"

                  if grep -q '__SITE_URL__' site/index.html; then
                      echo "placeholder left unreplaced" >&2
                      exit 1
                  fi

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site

            - id: deployment
              uses: actions/deploy-pages@v4
