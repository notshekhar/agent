name: ci

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: bun install --frozen-lockfile
            - run: bun test
            - run: bun run build
            - name: Smoke test built CLI
              run: node packages/cli/dist/cli.js --help || node packages/cli/dist/cli.js help || true

    # Exercises action.yml end-to-end (install latest release binary, run a
    # trivial prompt, read back the output). The `secrets` context is not
    # allowed in `if` conditions at any level, so the key rides job env and
    # the gate tests env — forked PRs skip automatically (no secrets). Note:
    # this runs the latest RELEASED loop, not this branch's source — it tests
    # the action packaging.
    action-selftest:
        runs-on: ubuntu-latest
        env:
            ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        steps:
            - uses: actions/checkout@v4
            - name: Run the action
              id: run-action
              if: env.ANTHROPIC_API_KEY != ''
              uses: ./
              with:
                  prompt: "Reply with the single word OK. Do not use any tools."
                  model: anthropic/claude-haiku-4-5
                  max-steps: "2"
            - name: Assert a non-empty response
              if: steps.run-action.conclusion == 'success' && env.ANTHROPIC_API_KEY != ''
              env:
                  RESPONSE: ${{ steps.run-action.outputs.response }}
              run: |
                  test -n "$RESPONSE"
                  echo "response: $RESPONSE"
