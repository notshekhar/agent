<!doctype html>
<!--
  Source for site/og.png. Rendered headless at 1200x630 by scripts/build-og.sh.
  Edit here, re-run the script, commit the PNG — social crawlers can't run JS,
  so the image has to be a real file.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    background: #16181a;
    color: #d4d4d4;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-ligatures: none;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 88px;
  }

  .wordmark {
    font-size: 232px;
    line-height: 0.82;
    letter-spacing: -0.055em;
    font-weight: 700;
    color: #d4d4d4;
  }
  .caret { color: #8abeb7; font-weight: 400; }

  .lede {
    margin-top: 44px;
    font-size: 38px;
    line-height: 1.35;
    letter-spacing: -0.01em;
  }
  .lede span { display: block; color: #808080; }
</style>
</head>
<body>
  <div class="wordmark">loop<span class="caret">_</span></div>
  <div class="lede">
    Terminal coding agent.
    <span>Bring your own model.</span>
  </div>
</body>
</html>
