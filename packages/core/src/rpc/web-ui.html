<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>loop</title>
        <style>
            /* Palette after opencode's v2 grey ramp; orange accent used sparingly. */
            :root {
                --bg: #161616;
                --bg-layer: #1c1c1c;
                --bg-raise: #242424;
                --bg-hover: #ffffff0f;
                --border: #ffffff14;
                --border-strong: #ffffff21;
                --text: #ededed;
                --muted: #a0a0a0;
                --faint: #7e7e7e;
                --accent: #ff8648;
                --green: #49c970;
                --red: #f1484f;
                --yellow: #f6c251;
                --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
                --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html,
            body {
                height: 100%;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--sans);
                font-size: 13px;
                line-height: 1.6;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                /* Mobile browsers: 100vh includes the URL bar; dvh tracks the real
         * visible height so the composer isn't hidden behind it. */
                height: 100dvh;
            }
            button {
                font: inherit;
                color: inherit;
                background: none;
                border: none;
                cursor: pointer;
            }
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            ::-webkit-scrollbar-thumb {
                background: var(--border-strong);
                border-radius: 4px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }

            /* ---------- top bar ---------- */
            header {
                display: flex;
                align-items: center;
                gap: 10px;
                height: 44px;
                padding: 0 16px;
                border-bottom: 1px solid var(--border);
                flex: none;
            }
            .brand {
                font-family: var(--mono);
                font-weight: 700;
                color: var(--text);
                letter-spacing: 0.5px;
            }
            #crumb {
                color: var(--muted);
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
                flex: 1;
                white-space: nowrap;
            }
            #crumb .sep {
                color: var(--faint);
                flex: none;
            }
            #crumb .projseg {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                max-width: 32%;
                flex: none;
            }
            #crumb .title {
                color: var(--text);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            #crumb button.back {
                color: var(--muted);
                padding: 3px 8px;
                border-radius: 5px;
            }
            #crumb button.back:hover {
                background: var(--bg-hover);
                color: var(--text);
            }
            #cost {
                color: var(--faint);
                font-family: var(--mono);
                font-size: 12px;
            }
            header .hbtn {
                color: var(--muted);
                font-size: 12px;
                padding: 4px 9px;
                border-radius: 6px;
                flex: none;
            }
            header .hbtn:hover {
                background: var(--bg-hover);
                color: var(--text);
            }
            #conn {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--red);
                flex: none;
            }
            #conn.ok {
                background: var(--green);
            }

            /* ---------- dialogs (usage, settings) ---------- */
            #dialogWrap {
                display: none;
                position: fixed;
                inset: 0;
                background: #00000080;
                align-items: flex-start;
                justify-content: center;
                padding: 8vh 20px 20px;
                z-index: 8;
            }
            #dialogWrap.visible {
                display: flex;
            }
            #dialog {
                background: var(--bg-layer);
                border: 1px solid var(--border-strong);
                border-radius: 12px;
                box-shadow: 0 12px 40px #00000080;
                width: 100%;
                max-width: 720px;
                max-height: 80vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            #dialog .dhead {
                display: flex;
                align-items: center;
                padding: 12px 16px;
                border-bottom: 1px solid var(--border);
                font-weight: 600;
            }
            #dialog .dhead .dclose {
                margin-left: auto;
                color: var(--muted);
                padding: 2px 8px;
                border-radius: 5px;
            }
            #dialog .dhead .dclose:hover {
                background: var(--bg-hover);
                color: var(--text);
            }
            #dialog .dbody {
                overflow-y: auto;
                padding: 16px;
            }

            /* usage: heatmap — accent-orange ramp so it belongs to the theme. */
            .steak-head {
                display: flex;
                align-items: baseline;
                gap: 10px;
                margin-bottom: 12px;
            }
            .steak-total {
                font-weight: 600;
            }
            .steak-sub {
                color: var(--faint);
                font-size: 12px;
            }
            .steak-scroll {
                overflow-x: auto;
                padding-bottom: 6px;
            }
            .steak-months {
                display: grid;
                gap: 3px;
                font-size: 10px;
                color: var(--faint);
                font-family: var(--mono);
                margin: 0 0 4px 32px;
            }
            .steak-grid {
                display: flex;
                gap: 4px;
            }
            .steak-days {
                display: grid;
                grid-template-rows: repeat(7, 12px);
                gap: 3px;
                font-size: 9px;
                line-height: 12px;
                color: var(--faint);
                font-family: var(--mono);
                width: 28px;
                flex: none;
            }
            .steak-cols {
                display: grid;
                grid-auto-flow: column;
                gap: 3px;
            }
            .steak-col {
                display: grid;
                grid-template-rows: repeat(7, 12px);
                gap: 3px;
            }
            .cell {
                width: 12px;
                height: 12px;
                border-radius: 3px;
            }
            .steak-col .cell:not(.lv-b):hover {
                outline: 1px solid var(--faint);
                outline-offset: -1px;
            }
            .lv-b {
                background: transparent;
            }
            .lv-0 {
                background: #242424;
            }
            .lv-1 {
                background: #4a2a17;
            }
            .lv-2 {
                background: #83431d;
            }
            .lv-3 {
                background: #c96426;
            }
            .lv-4 {
                background: var(--accent);
            }
            .steak-legend {
                display: flex;
                align-items: center;
                gap: 3px;
                margin: 8px 0 0 32px;
                color: var(--faint);
                font-size: 11px;
            }
            .steak-legend .cell {
                margin: 0 1px;
            }

            /* usage: streak stat tiles */
            .stat-row {
                display: flex;
                gap: 10px;
                margin-top: 16px;
                flex-wrap: wrap;
            }
            .stat {
                flex: 1;
                min-width: 120px;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 10px 12px;
            }
            .stat .sval {
                font-family: var(--mono);
                font-size: 16px;
                font-weight: 600;
                color: var(--text);
            }
            .stat .sname {
                color: var(--faint);
                font-size: 11px;
                margin-top: 2px;
            }
            .stat .snote {
                color: var(--faint);
                font-size: 11px;
                font-family: var(--mono);
            }

            /* context dialog: stacked bar + legend */
            .ctx-head {
                display: flex;
                align-items: baseline;
                gap: 10px;
                margin-bottom: 4px;
                flex-wrap: wrap;
            }
            .ctx-head .chl {
                font-weight: 600;
            }
            .ctx-head .chm {
                color: var(--faint);
                font-size: 12px;
                font-family: var(--mono);
            }
            .ctx-bar {
                display: flex;
                height: 14px;
                border-radius: 7px;
                overflow: hidden;
                background: var(--bg-raise);
                margin: 10px 0 4px;
                position: relative;
            }
            .ctx-bar .seg {
                height: 100%;
                min-width: 2px;
            }
            .ctx-bar .compact-mark {
                position: absolute;
                top: -2px;
                bottom: -2px;
                width: 2px;
                background: var(--yellow);
                opacity: 0.8;
            }
            .ctx-marknote {
                color: var(--faint);
                font-size: 11px;
                margin-bottom: 10px;
            }
            .ctx-row {
                display: flex;
                align-items: baseline;
                gap: 10px;
                padding: 4px 0;
                font-family: var(--mono);
                font-size: 12px;
            }
            .ctx-row .dot {
                width: 9px;
                height: 9px;
                border-radius: 3px;
                flex: none;
                align-self: center;
            }
            .ctx-row .clabel {
                color: var(--muted);
                flex: 1;
                font-family: var(--sans);
            }
            .ctx-row .ctok {
                color: var(--text);
                width: 80px;
                text-align: right;
                flex: none;
            }
            .ctx-row .cpct {
                color: var(--faint);
                width: 56px;
                text-align: right;
                flex: none;
            }
            .ctx-row.free .clabel,
            .ctx-row.free .ctok,
            .ctx-row.free .cpct {
                color: var(--faint);
            }
            .ctx-skills {
                margin-top: 14px;
            }

            /* extension rows: reuse set-row; badge for built-in / version */
            .set-row .sbadge {
                flex: none;
                color: var(--faint);
                font-family: var(--mono);
                font-size: 10px;
                border: 1px solid var(--border-strong);
                border-radius: 4px;
                padding: 1px 6px;
            }

            /* usage: cost table */
            .cost-table {
                margin-top: 20px;
            }
            .cost-row {
                display: flex;
                align-items: baseline;
                gap: 12px;
                padding: 4px 0;
                font-family: var(--mono);
                font-size: 12px;
            }
            .cost-row .clabel {
                color: var(--muted);
                width: 130px;
                flex: none;
            }
            .cost-row .cval {
                color: var(--text);
                width: 90px;
                text-align: right;
                flex: none;
            }
            .cost-row .cextra {
                color: var(--faint);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .cost-row.sub .clabel {
                padding-left: 14px;
                color: var(--faint);
            }
            .cost-head {
                font-weight: 600;
                margin: 16px 0 6px;
                font-family: var(--sans);
            }

            /* settings rows */
            .set-row {
                display: flex;
                align-items: center;
                gap: 12px;
                width: 100%;
                padding: 10px 8px;
                border-radius: 8px;
                text-align: left;
            }
            .set-row:hover {
                background: var(--bg-hover);
            }
            .set-row .smain {
                flex: 1;
                min-width: 0;
            }
            .set-row .slabel {
                color: var(--text);
                font-weight: 530;
            }
            .set-row .sdesc {
                color: var(--faint);
                font-size: 12px;
            }
            .toggle {
                flex: none;
                width: 34px;
                height: 19px;
                border-radius: 10px;
                background: var(--bg-raise);
                border: 1px solid var(--border-strong);
                position: relative;
                transition: background 0.15s;
            }
            .toggle::after {
                content: "";
                position: absolute;
                top: 2px;
                left: 2px;
                width: 13px;
                height: 13px;
                border-radius: 50%;
                background: var(--muted);
                transition:
                    transform 0.15s,
                    background 0.15s;
            }
            .set-row.on .toggle {
                background: #2e5c3f;
                border-color: #3a7a52;
            }
            .set-row.on .toggle::after {
                transform: translateX(15px);
                background: var(--green);
            }

            /* ---------- home ---------- */
            #home {
                display: none;
                flex: 1;
                min-height: 0;
            }
            #home.visible {
                display: flex;
            }

            #rail {
                width: 260px;
                flex: none;
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                min-height: 0;
                padding: 12px 8px;
                gap: 2px;
            }
            #rail .section {
                color: var(--faint);
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.6px;
                padding: 4px 10px 6px;
            }
            #projects {
                overflow-y: auto;
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 1px;
            }
            .proj {
                display: flex;
                align-items: center;
                gap: 9px;
                padding: 5px 10px;
                border-radius: 6px;
                color: var(--muted);
                text-align: left;
                width: 100%;
            }
            .proj:hover {
                background: var(--bg-hover);
                color: var(--text);
            }
            .proj.active {
                background: var(--bg-raise);
                color: var(--text);
                box-shadow: inset 0 0 0 0.5px var(--border-strong);
            }
            .proj .avatar {
                width: 20px;
                height: 20px;
                border-radius: 5px;
                flex: none;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 9px;
                font-weight: 700;
                font-family: var(--mono);
                text-transform: uppercase;
            }
            .proj .pname {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .proj .count {
                color: var(--faint);
                font-size: 11px;
                font-family: var(--mono);
            }
            #openProject {
                margin-top: 8px;
                padding: 6px 10px;
                border-radius: 6px;
                border: 1px dashed var(--border-strong);
                color: var(--muted);
                text-align: center;
            }
            #openProject:hover {
                color: var(--text);
                border-color: var(--faint);
            }
            #openForm {
                display: none;
                margin-top: 8px;
                padding: 0 2px;
            }
            #openForm.visible {
                display: block;
            }
            #openForm input {
                width: 100%;
                background: var(--bg-layer);
                border: 1px solid var(--border-strong);
                border-radius: 6px;
                color: var(--text);
                font-family: var(--mono);
                font-size: 12px;
                padding: 6px 8px;
            }
            #openForm input:focus {
                outline: none;
                border-color: var(--faint);
            }
            #openForm .hint {
                color: var(--faint);
                font-size: 11px;
                padding: 4px 2px 0;
            }

            #homeMain {
                flex: 1;
                min-width: 0;
                overflow-y: auto;
            }
            #homeCol {
                max-width: 680px;
                margin: 0 auto;
                padding: 32px 24px 64px;
            }
            #homeTop {
                display: flex;
                gap: 10px;
                align-items: center;
                margin-bottom: 20px;
            }
            #search {
                flex: 1;
                background: var(--bg-layer);
                border: 1px solid var(--border);
                border-radius: 8px;
                color: var(--text);
                font: inherit;
                padding: 8px 12px;
            }
            #search:focus {
                outline: none;
                border-color: var(--border-strong);
            }
            #search::placeholder {
                color: var(--faint);
            }
            #newSession {
                background: var(--text);
                color: var(--bg);
                font-weight: 600;
                padding: 8px 14px;
                border-radius: 8px;
                flex: none;
            }
            #newSession:hover {
                background: #fff;
            }
            .group-title {
                color: var(--faint);
                font-size: 12px;
                font-weight: 600;
                padding: 18px 4px 6px;
            }
            .srow {
                display: flex;
                align-items: center;
                gap: 10px;
                width: 100%;
                padding: 8px 10px;
                border-radius: 8px;
                text-align: left;
            }
            .srow:hover {
                background: var(--bg-hover);
            }
            .srow .stitle {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                color: var(--text);
                font-weight: 530;
            }
            .srow .schip {
                color: var(--muted);
                font-size: 12px;
                flex: none;
                max-width: 160px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .srow .stime {
                color: var(--faint);
                font-size: 12px;
                flex: none;
                width: 52px;
                text-align: right;
                font-variant-numeric: tabular-nums;
            }
            .srow .live {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--green);
                flex: none;
                animation: pulse 1.4s ease-in-out infinite;
            }
            .home-empty {
                color: var(--faint);
                padding: 32px 4px;
                text-align: center;
            }

            /* ---------- chat ---------- */
            #chat {
                display: none;
                flex: 1;
                min-height: 0;
                flex-direction: column;
            }
            #chat.visible {
                display: flex;
            }
            #transcript {
                flex: 1;
                overflow-y: auto;
            }
            #blocks {
                max-width: 760px;
                margin: 0 auto;
                padding: 24px 24px 40px;
            }

            .block {
                margin-bottom: 16px;
                overflow-wrap: break-word;
            }
            .block.user {
                background: var(--bg-layer);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 10px 14px;
                white-space: pre-wrap;
                color: var(--text);
            }
            .block.user.queued {
                opacity: 0.7;
                border-style: dashed;
            }
            .block.user.queued .qtag {
                color: var(--yellow);
                font-family: var(--mono);
                font-size: 11px;
                margin-right: 8px;
            }
            .block.user.queued .qremove {
                float: right;
                color: var(--faint);
                font-family: var(--mono);
                font-size: 11px;
                padding: 0 4px;
                border-radius: 4px;
            }
            .block.user.queued .qremove:hover {
                color: var(--red);
                background: var(--bg-hover);
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.35;
                }
            }
            #chatTools button.busy {
                color: var(--yellow);
                border-color: var(--border-strong);
                animation: pulse 1.2s ease-in-out infinite;
            }
            .block.note {
                color: var(--faint);
                font-size: 12px;
            }
            .block.error {
                color: var(--red);
                white-space: pre-wrap;
                font-family: var(--mono);
                font-size: 12px;
                border: 1px solid #f1484f40;
                border-radius: 8px;
                padding: 8px 12px;
            }
            .md {
                white-space: pre-wrap;
            }
            .md code {
                font-family: var(--mono);
                font-size: 12px;
                background: var(--bg-raise);
                padding: 1px 5px;
                border-radius: 4px;
            }
            .md .h {
                font-weight: 700;
                font-size: 14px;
            }
            .md a {
                color: var(--accent);
                text-decoration: none;
            }
            .md a:hover {
                text-decoration: underline;
            }
            .md .codewrap {
                position: relative;
                margin: 8px 0;
            }
            .md pre {
                background: var(--bg-layer);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 10px 12px;
                overflow-x: auto;
                white-space: pre;
            }
            .md pre code {
                background: none;
                padding: 0;
            }
            .copy-btn {
                position: absolute;
                top: 6px;
                right: 6px;
                color: var(--faint);
                font-size: 11px;
                font-family: var(--mono);
                background: var(--bg-raise);
                border: 1px solid var(--border);
                border-radius: 5px;
                padding: 2px 8px;
                opacity: 0;
                transition: opacity 0.12s;
            }
            .codewrap:hover .copy-btn,
            .block.assistant:hover > .copy-btn {
                opacity: 1;
            }
            .copy-btn:hover {
                color: var(--text);
                border-color: var(--border-strong);
            }
            .block.assistant {
                position: relative;
            }
            .block.assistant > .copy-btn {
                top: 0;
                right: 0;
            }

            /* per-tool bodies */
            .term {
                background: #101010;
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 8px 12px;
                font-family: var(--mono);
                font-size: 12px;
                margin: 4px 0;
                overflow-x: auto;
            }
            .term .cmd {
                color: var(--text);
                white-space: pre-wrap;
                overflow-wrap: break-word;
            }
            .term .cmd::before {
                content: "$ ";
                color: var(--green);
            }
            .term .out {
                color: var(--muted);
                white-space: pre-wrap;
                overflow-wrap: break-word;
                margin-top: 6px;
                max-height: 300px;
                overflow-y: auto;
            }
            .diff {
                font-family: var(--mono);
                font-size: 12px;
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
                margin: 4px 0;
            }
            .diff .dfile {
                padding: 5px 10px;
                color: var(--muted);
                background: var(--bg-raise);
                border-bottom: 1px solid var(--border);
            }
            .diff .dl {
                padding: 1px 10px;
                white-space: pre-wrap;
                overflow-wrap: break-word;
            }
            .diff .dl.del {
                background: #f1484f1a;
                color: #f2bbb7;
            }
            .diff .dl.del::before {
                content: "- ";
                color: var(--red);
            }
            .diff .dl.add {
                background: #49c9701a;
                color: #b8e9c1;
            }
            .diff .dl.add::before {
                content: "+ ";
                color: var(--green);
            }

            /* Compact expandable rows for tools / reasoning / subagents. */
            details.row {
                margin: 6px 0;
                border-radius: 8px;
            }
            details.row summary {
                list-style: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 4px 8px;
                border-radius: 6px;
                color: var(--muted);
                font-family: var(--mono);
                font-size: 12px;
                white-space: nowrap;
                overflow: hidden;
                user-select: none;
            }
            details.row summary::-webkit-details-marker {
                display: none;
            }
            details.row summary:hover {
                background: var(--bg-hover);
            }
            details.row summary .chev {
                color: var(--faint);
                flex: none;
                width: 10px;
                transition: transform 0.12s;
            }
            details.row[open] summary .chev {
                transform: rotate(90deg);
            }
            details.row summary .tname {
                color: var(--text);
                flex: none;
            }
            details.row summary .tsum {
                color: var(--faint);
                overflow: hidden;
                text-overflow: ellipsis;
            }
            details.row.running summary .tname {
                color: var(--yellow);
            }
            details.row.error summary .tname {
                color: var(--red);
            }
            details.row .body {
                margin: 2px 0 4px 18px;
                border-left: 1px solid var(--border-strong);
                padding: 4px 0 4px 12px;
            }
            details.row .body .label {
                color: var(--faint);
                font-size: 11px;
                font-family: var(--mono);
                margin-top: 6px;
            }
            details.row .body pre {
                font-family: var(--mono);
                font-size: 12px;
                white-space: pre-wrap;
                overflow-wrap: break-word;
                max-height: 320px;
                overflow-y: auto;
                margin: 4px 0;
                color: var(--muted);
            }
            details.row.reasoning summary .tname {
                color: var(--muted);
                font-style: italic;
            }
            details.row .body .line {
                color: var(--faint);
                font-family: var(--mono);
                font-size: 12px;
            }
            details.row .body .line.text {
                color: var(--muted);
                white-space: pre-wrap;
            }

            #todos {
                display: none;
                max-width: 760px;
                margin: 0 auto;
                width: 100%;
                padding: 0 24px 6px;
                color: var(--faint);
                font-family: var(--mono);
                font-size: 12px;
                max-height: 110px;
                overflow-y: auto;
                flex: none;
            }
            #todos.visible {
                display: block;
            }
            #todos .done {
                text-decoration: line-through;
            }

            /* chat toolbar row below the composer + floating scroll button */
            #chatTools {
                max-width: 760px;
                margin: 0 auto;
                width: 100%;
                padding: 6px 4px 0;
                display: flex;
                gap: 6px;
                align-items: center;
                flex: none;
            }
            #chatTools button,
            #controls .cbtn {
                color: var(--faint);
                font-size: 11px;
                font-family: var(--mono);
                padding: 3px 8px;
                border-radius: 5px;
                border: 1px solid transparent;
            }
            #chatTools button:hover,
            #controls .cbtn:hover {
                background: var(--bg-hover);
                color: var(--text);
            }
            #controls .cbtn:disabled {
                opacity: 0.4;
                cursor: default;
            }
            #ctx {
                color: var(--faint);
                font-family: var(--mono);
                font-size: 12px;
            }
            #scrollDown {
                display: none;
                position: absolute;
                bottom: 14px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--bg-raise);
                border: 1px solid var(--border-strong);
                color: var(--muted);
                border-radius: 14px;
                padding: 3px 14px;
                font-size: 11px;
                font-family: var(--mono);
                box-shadow: 0 4px 12px #00000059;
                z-index: 3;
            }
            #scrollDown.visible {
                display: block;
            }
            #scrollDown:hover {
                color: var(--text);
            }
            #transcriptWrap {
                flex: 1;
                min-height: 0;
                position: relative;
                display: flex;
                flex-direction: column;
            }
            #thinkSel {
                background: transparent;
                border: none;
                border-radius: 5px;
                color: var(--faint);
                font-family: var(--mono);
                font-size: 11px;
                padding: 3px 4px;
                cursor: pointer;
            }
            #thinkSel:hover,
            #thinkSel:focus {
                background: var(--bg-hover);
                color: var(--text);
                outline: none;
            }
            #thinkSel option {
                background: var(--bg-raise);
                color: var(--text);
            }
            #crumb .title.renamable {
                cursor: text;
            }
            #crumb .title.renamable:hover {
                text-decoration: underline dotted var(--faint);
            }
            #crumb input.rename {
                background: var(--bg-layer);
                border: 1px solid var(--border-strong);
                border-radius: 5px;
                color: var(--text);
                font: inherit;
                padding: 2px 8px;
                min-width: 220px;
            }
            #crumb input.rename:focus {
                outline: none;
                border-color: var(--faint);
            }

            /* opencode-style composer: one bordered box, controls inside. */
            #composerWrap {
                flex: none;
                padding: 0 24px 18px;
            }
            #composer.dragging {
                border-color: var(--accent);
                box-shadow: 0 0 0 1px var(--accent);
            }
            /* Full-viewport drop target shown while a file drag is over the window. */
            #dropZone {
                display: none;
                position: fixed;
                inset: 0;
                background: #161616e6;
                z-index: 9;
                align-items: center;
                justify-content: center;
                padding: 40px;
            }
            #dropZone.visible {
                display: flex;
            }
            #dropZone .dz-box {
                width: 100%;
                max-width: 560px;
                border: 2px dashed var(--accent);
                border-radius: 16px;
                padding: 56px 24px;
                text-align: center;
                color: var(--text);
                font-weight: 600;
                pointer-events: none;
            }
            #dropZone .dz-box .dz-sub {
                color: var(--faint);
                font-weight: 400;
                font-size: 12px;
                margin-top: 6px;
            }
            #attachments {
                display: none;
                flex-wrap: wrap;
                gap: 8px;
                padding: 10px 12px 0;
            }
            #attachments.visible {
                display: flex;
            }
            #attachments .att {
                position: relative;
                width: 52px;
                height: 52px;
                border-radius: 8px;
                border: 1px solid var(--border-strong);
                overflow: hidden;
                flex: none;
            }
            #attachments .att img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            #attachments .att button {
                position: absolute;
                top: 2px;
                right: 2px;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: #000000b3;
                color: var(--text);
                font-size: 11px;
                line-height: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #attachments .att button:hover {
                background: var(--red);
            }
            #composer {
                max-width: 760px;
                margin: 0 auto;
                background: var(--bg-layer);
                border: 1px solid var(--border-strong);
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                transition: border-color 0.12s;
            }
            #composer:focus-within {
                border-color: var(--faint);
            }
            #input {
                background: none;
                border: none;
                color: var(--text);
                font: inherit;
                padding: 12px 14px 4px;
                resize: none;
                min-height: 44px;
                max-height: 240px;
            }
            #input:focus {
                outline: none;
            }
            #input::placeholder {
                color: var(--faint);
            }
            #controls {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 6px 8px 8px;
                position: relative;
            }
            #modelBtn {
                background: transparent;
                border-radius: 6px;
                color: var(--muted);
                font-family: var(--mono);

                text-overflow: ellipsis;

            #modelBtn:hover,
            #modelBtn:focus {
                background: var(--bg-hover);
                color: var(--text);

            #modelBtn .chev {
                color: var(--faint);
                margin-left: 4px;

            /* Two-step picker (provider -> model), like the CLI's /model flow. */
            #modelPop {
                display: none;
                position: absolute;
                bottom: calc(100% + 6px);
                left: 4px;
                width: min(320px, calc(100vw - 56px));

                border: 1px solid var(--border-strong);
                border-radius: 10px;
                box-shadow: 0 8px 24px #00000066;
                overflow: hidden;
                z-index: 5;
            }
            #modelPop.visible {
                display: block;
            }
            #modelPop .phead {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 8px 10px 0;
            }
            #modelPop .phead .pback {
                display: none;
                color: var(--muted);
                font-size: 12px;
                padding: 2px 6px;
                border-radius: 5px;
                flex: none;
            }
            #modelPop .phead .pback:hover {
                background: var(--bg-hover);
                color: var(--text);
            }
            #modelPop.models .phead .pback {
                display: block;
            }
            #modelPop .phead input {
                flex: 1;
                background: var(--bg-layer);
                border: 1px solid var(--border);
                border-radius: 6px;
                color: var(--text);
                font-family: var(--mono);
                font-size: 12px;
                padding: 5px 8px;
                min-width: 0;
            }
            #modelPop .phead input:focus {
                outline: none;
                border-color: var(--faint);
            }
            #modelPop .plist {
                max-height: 280px;
                overflow-y: auto;
                padding: 6px;
            }
            #modelPop .pitem {
                display: flex;
                align-items: center;
                gap: 8px;
                width: 100%;
                padding: 5px 8px;
                border-radius: 6px;
                text-align: left;
                font-family: var(--mono);
                font-size: 12px;
                color: var(--muted);
            }
            #modelPop .pitem:hover,
            #modelPop .pitem.hot {
                background: var(--bg-hover);
                color: var(--text);
            }
            #modelPop .pitem .pmain {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            #modelPop .pitem .pmeta {
                color: var(--faint);
                font-size: 11px;
                flex: none;
            }
            #modelPop .pitem.current .pmain {
                color: var(--accent);
            }
            #modelPop .pempty {
                color: var(--faint);
                padding: 10px;
                font-size: 12px;
            }
            #status {
                color: var(--faint);
                font-size: 12px;
                margin-left: 8px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                flex: 1;
            }
            #send,
            #stop {
                flex: none;
                font-weight: 600;
                padding: 5px 14px;
                border-radius: 7px;
            }
            #send {
                background: var(--text);
                color: var(--bg);
            }
            #send:hover {
                background: #fff;
            }
            #send:disabled {
                background: var(--bg-raise);
                color: var(--faint);
                cursor: default;
            }
            #stop {
                display: none;
                background: none;
                border: 1px solid #f1484f66;
                color: var(--red);
            }
            #stop.visible {
                display: block;
            }

            #overlay {
                position: fixed;
                inset: 0;
                background: var(--bg);
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--faint);
                text-align: center;
                padding: 20px;
                white-space: pre-wrap;
                z-index: 10;
            }
            #overlay.hidden {
                display: none;
            }

            /* ---------- touch devices (any width) ---------- */
            @media (pointer: coarse) {
                /* Hover affordances don't exist on touch — keep copy buttons visible. */
                .copy-btn {
                    opacity: 0.75;
                }
                /* Comfortable tap targets. */
                details.row summary {
                    padding: 8px;
                }
                #modelPop .pitem {
                    padding: 10px;
                }
                #chatTools button {
                    padding: 6px 10px;
                }
                header .hbtn {
                    padding: 7px 8px;
                }
                #send,
                #stop {
                    padding: 8px 18px;
                }
                #thinkSel,
                #modelBtn {
                    padding: 7px 8px;
                }
                #attachments .att {
                    width: 60px;
                    height: 60px;
                }
                #attachments .att button {
                    width: 20px;
                    height: 20px;
                }
            }

            /* Attach button (file picker) — the touch path to images; drag/paste stay. */
            #attachBtn {
                flex: none;
                color: var(--faint);
                font-size: 15px;
                line-height: 1;
                padding: 4px 9px;
                border-radius: 6px;
                border: 1px solid transparent;
            }
            #attachBtn:hover {
                background: var(--bg-hover);
                color: var(--text);
            }

            /* ---------- mobile (touch phones / narrow windows) ---------- */
            @media (max-width: 700px) {
                /* iOS zooms the page when a focused input's font is under 16px —
         * bump every text input to 16px to keep the viewport stable. */
                #input,
                #search,
                #openPath,
                #modelPop .pfilter,
                #crumb input.rename {
                    font-size: 16px;
                }

                header {
                    padding: 0 10px;
                    gap: 6px;
                    height: 42px;

                header .brand {
                    display: none;
                }
                #cost {
                    display: none;
                }
                header .hbtn {
                    padding: 4px 6px;
                    font-size: 11px;
                }
                /* Session title gets the room; the project is one tap away (back). */
                #crumb .projseg,
                #crumb .sep {
                    display: none;
                }

                /* Projects rail becomes a horizontal strip above the session list. */
                #home {
                    flex-direction: column;
                }
                #rail {
                    width: 100%;
                    flex-direction: row;
                    align-items: center;
                    height: auto;
                    border-right: none;
                    border-bottom: 1px solid var(--border);

                    gap: 6px;
                    flex: none;
                }
                #rail .section {
                    display: none;
                }
                #projects {
                    flex-direction: row;
                    overflow-x: auto;
                    overflow-y: hidden;

                    gap: 6px;
                    scrollbar-width: none;

                #projects::-webkit-scrollbar {
                    display: none;

                .proj {
                    width: auto;
                    flex: none;
                    padding: 5px 8px;
                }
                .proj .pname {

                }
                .proj .count {
                    display: none;
                }
                #openProject {
                    margin-top: 0;
                    flex: none;
                    padding: 5px 9px;
                    white-space: nowrap;
                }
                #openForm.visible {
                    position: fixed;
                    top: 50px;
                    left: 10px;
                    right: 10px;
                    z-index: 6;
                    margin: 0;
                    background: var(--bg-raise);
                    border: 1px solid var(--border-strong);
                    border-radius: 10px;
                    padding: 10px;
                    box-shadow: 0 8px 24px #00000066;
                }

                #homeCol {
                    padding: 14px 12px 48px;
                }
                #homeTop {
                    gap: 8px;
                    margin-bottom: 12px;
                }
                #newSession {
                    padding: 8px 10px;
                }
                .srow .schip {
                    display: none;
                }
                .srow {
                    padding: 10px 8px;
                } /* comfortable touch target */

                /* Chat: tighter gutters, wrapping composer controls. */
                #blocks {
                    padding: 14px 12px 32px;
                }
                #chatTools {
                    padding: 6px 2px 0;
                }
                #composerWrap {
                    padding: 0 10px 10px;
                }
                /* One tidy row: attach, model, think left; send/stop pinned right.
         * If it must wrap, send keeps right alignment via margin-left:auto. */
                #controls {
                    flex-wrap: wrap;
                    row-gap: 4px;
                }
                #modelBtn {
                    max-width: 38vw;
                }
                #send,
                #stop {
                    margin-left: auto;
                }
                #status {
                    flex-basis: 100%;
                    order: 9;
                    margin-left: 2px;
                }
                details.row .body {
                    margin-left: 8px;

                /* Dialogs go full screen. */
                #dialogWrap {
                    padding: 0;
                }
                #dialog {
                    max-width: 100%;
                    height: 100%;
                    max-height: 100%;
                    border-radius: 0;
                }

                /* Cost table: tighter fixed columns so the extra text keeps room. */
                .cost-row .clabel {
                    width: 104px;
                }
                .cost-row .cval {
                    width: 78px;
                }
            }
        </style>
    </head>
    <body>
        <div id="overlay">connecting…</div>
        <header>
            <span class="brand">loop</span>
            <span id="crumb"></span>
            <span id="cost"></span>
            <button class="hbtn" id="headerNew">+ new session</button>
            <button class="hbtn" id="usageBtn">usage</button>
            <button class="hbtn" id="extBtn">extensions</button>
            <button class="hbtn" id="settingsBtn">settings</button>
            <span id="conn" title="connection"></span>
        </header>
        <div id="dropZone">
            <div class="dz-box">
                Drop images to attach
                <div class="dz-sub">png · jpeg · gif · webp · bmp — sent with your next prompt</div>
            </div>
        </div>
        <div id="dialogWrap">
            <div id="dialog">
                <div class="dhead"><span id="dialogTitle"></span><button class="dclose">close</button></div>
                <div class="dbody" id="dialogBody"></div>
            </div>
        </div>

        <div id="home">
            <div id="rail">
                <div class="section">Projects</div>
                <div id="projects"></div>
                <button id="openProject">Open project</button>
                <div id="openForm">
                    <input id="openPath" spellcheck="false" placeholder="/path/to/project" />
                    <div class="hint">Enter to open, Esc to close</div>
                </div>
            </div>
            <div id="homeMain">
                <div id="homeCol">
                    <div id="homeTop">
                        <input id="search" placeholder="Search sessions" spellcheck="false" />
                        <button id="newSession">New session</button>
                    </div>
                    <div id="sessionGroups"></div>
                </div>
            </div>
        </div>

        <div id="chat">
            <div id="transcriptWrap">
                <div id="transcript"><div id="blocks"></div></div>
                <button id="scrollDown">jump to latest</button>
            </div>
            <div id="todos"></div>
            <div id="composerWrap">
                <div id="composer">
                    <div id="attachments"></div>
                    <textarea
                        id="input"
                        placeholder="Ask anything — Enter to send, Shift+Enter for newline"
                        rows="1"
                    ></textarea>
                    <div id="controls">
                        <button id="attachBtn" title="attach images">+</button>
                        <input
                            id="fileInput"
                            type="file"
                            accept="image/png,image/jpeg,image/gif,image/webp,image/bmp"
                            multiple
                            hidden
                        />
                        <button id="modelBtn" title="model"></button>
                        <div id="modelPop">
                            <div class="phead">
                                <button class="pback">back</button>
                                <input class="pfilter" placeholder="filter" spellcheck="false" />
                            </div>
                            <div class="plist"></div>
                        </div>
                        <select id="thinkSel" title="thinking effort for the next prompts">
                            <option value="">think: default</option>
                            <option value="off">think: off</option>
                            <option value="minimal">think: minimal</option>
                            <option value="low">think: low</option>
                            <option value="medium">think: medium</option>
                            <option value="high">think: high</option>
                            <option value="xhigh">think: xhigh</option>
                        </select>

                        <button id="stop">stop</button>
                        <button id="send">send</button>
                    </div>
                </div>
                <div id="chatTools">
                    <button id="toggleTools" title="expand or collapse every tool card">expand tools</button>
                    <button id="compactBtn" title="summarize older turns to free context">compact</button>
                    <button id="ctxBtn" title="what fills the context window">context</button>
                    <span
                        id="ctx"
                        title="approximate context tokens — click for the breakdown"
                        style="margin-left: auto; cursor: pointer"
                    ></span>
                </div>
            </div>
        </div>

        <script>
            "use strict";

            /* ---------- helpers ---------- */

            const $ = (id) => document.getElementById(id);
            const TRUNCATE = 4000;

            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
                );
            }
            function truncate(s) {
                s = String(s);
                return s.length > TRUNCATE
                    ? s.slice(0, TRUNCATE) + "\n… (" + (s.length - TRUNCATE) + " more chars)"
                    : s;
            }
            function md(text) {
                const parts = String(text).split(/```/);
                let out = "";
                for (let i = 0; i < parts.length; i++) {
                    if (i % 2 === 1) {
                        const body = parts[i].replace(/^[a-zA-Z0-9_-]*\n/, "");
                        // codewrap hosts the hover copy button (wired via delegation).
                        out +=
                            '<span class="codewrap"><pre><code>' +
                            esc(body) +
                            '</code></pre><button class="copy-btn">copy</button></span>';
                    } else {
                        out += esc(parts[i])
                            .replace(/`([^`\n]+)`/g, "<code>$1</code>")
                            .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
                            // markdown links; only http(s) targets, new tab.
                            .replace(
                                /\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,
                                '<a href="$2" target="_blank" rel="noreferrer">$1</a>',
                            )
                            // #/##/### headings at line start
                            .replace(/(^|\n)#{1,3} ([^\n]+)/g, '$1<span class="h">$2</span>')
                            // bullet lists render with a proper dot
                            .replace(/(^|\n)- /g, "$1&#8226; ");
                    }
                }
                return out;
            }
            function pretty(v) {
                if (v === undefined || v === null) return "";
                if (typeof v === "string") return v;
                try {
                    return JSON.stringify(v, null, 2);
                } catch {
                    return String(v);
                }
            }

            /* Tool results arrive in wrapper shapes ({type:"text", value}, {text}, arrays
             * of those) — unwrap to the actual text instead of printing raw JSON. */
            function toolOutputText(v) {
                if (v === undefined || v === null) return "";
                if (typeof v === "string") return v;
                if (Array.isArray(v)) return v.map(toolOutputText).filter(Boolean).join("\n");
                if (typeof v === "object") {
                    if (typeof v.value === "string") return v.value;
                    if (typeof v.text === "string") return v.text;
                    if (typeof v.output === "string") return v.output;
                }
                return pretty(v);
            }
            function basename(p) {
                const parts = String(p).replace(/\/+$/, "").split("/");
                return parts[parts.length - 1] || p;
            }
            function hueOf(s) {
                let h = 0;
                for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
                return h % 360;
            }
            function relTime(ts) {
                const d = Date.now() - ts;
                if (d < 60000) return "now";
                if (d < 3600000) return Math.floor(d / 60000) + "m";
                if (d < 86400000) return Math.floor(d / 3600000) + "h";
                return Math.floor(d / 86400000) + "d";
            }
            function dayGroup(ts) {
                const now = new Date();
                const day = (t) => Math.floor((t - new Date(t).getTimezoneOffset() * 60000) / 86400000);
                const today = day(now.getTime());
                const that = day(ts);
                if (that === today) return "Today";
                if (that === today - 1) return "Yesterday";
                return "Older";
            }
            function sessionTitle(s) {
                return s.name || (s.firstUserMessage || "").split("\n")[0] || "(no prompt yet)";
            }

            /* ---------- RPC over WebSocket ---------- */

            const token = new URLSearchParams(location.search).get("token") || "";
            let ws = null;
            let nextId = 1;
            const pending = new Map();
            let connected = false;
            let reconnectDelay = 500;

            function connect() {
                const proto = location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(proto + "//" + location.host + "/ws?token=" + encodeURIComponent(token));
                ws.onopen = () => {
                    connected = true;
                    reconnectDelay = 500;
                    $("conn").classList.add("ok");
                    boot();
                };
                ws.onmessage = (e) => {
                    let msg;
                    try {
                        msg = JSON.parse(e.data);
                    } catch {
                        return;
                    }
                    if (msg.id !== undefined && pending.has(msg.id)) {
                        const { resolve, reject } = pending.get(msg.id);
                        pending.delete(msg.id);
                        if (msg.error) reject(new Error(msg.error.message));
                        else resolve(msg.result);
                    } else if (msg.method === "session.event") {
                        onEvent(msg.params);
                    }
                };
                ws.onclose = () => {
                    connected = false;
                    $("conn").classList.remove("ok");
                    for (const { reject } of pending.values()) reject(new Error("connection closed"));
                    pending.clear();
                    setStatus("disconnected — reconnecting…");
                    setTimeout(connect, reconnectDelay);
                    reconnectDelay = Math.min(reconnectDelay * 2, 10000);
                };
            }
            function rpc(method, params, timeoutMs) {
                return new Promise((resolve, reject) => {
                    if (!connected) return reject(new Error("not connected"));
                    const id = nextId++;
                    // A lost response must not hang its caller forever; compact passes a
                    // long budget (it awaits a real model call), everything else 30s.
                    const timer = setTimeout(() => {
                        if (pending.delete(id)) reject(new Error(method + " timed out"));
                    }, timeoutMs || 30000);
                    pending.set(id, {
                        resolve: (v) => {
                            clearTimeout(timer);
                            resolve(v);
                        },
                        reject: (e) => {
                            clearTimeout(timer);
                            reject(e);
                        },
                    });
                    ws.send(JSON.stringify({ jsonrpc: "2.0", id, method, params }));
                });
            }

            /* ---------- state ---------- */

            let serverInfo = null;
            let catalog = [];
            let authProviders = [];
            let sessions = [];
            let selectedProject = null; // cwd string or null = all
            let current = null; // open session: { id, model, name, cwd, draft }
            let selectedModel = "";
            let running = false;
            let lastSeq = 0; // last session.event seq seen for `current` (reconnect catch-up)

            const blocks = $("blocks");
            let liveText = null;
            let liveReasoning = null;
            const toolCards = new Map();
            const subagentCards = new Map();

            function setStatus(s) {
                $("status").textContent = s;
            }
            function setRunning(r) {
                running = r;
                $("stop").classList.toggle("visible", r);
                $("send").disabled = r;
                if (!r) setStatus("");
            }

            /* ---------- views ---------- */

            function showHome() {
                current = null;
                $("chat").classList.remove("visible");
                $("home").classList.add("visible");
                renderCrumb();
                renderHome();
                refreshSessions();
                $("search").focus();
            }

            function showChat() {
                $("home").classList.remove("visible");
                $("chat").classList.add("visible");
                renderCrumb();
                $("input").focus();
            }

            function renderCrumb() {
                const el = $("crumb");
                el.innerHTML = "";
                if (!current) {
                    const span = document.createElement("span");
                    span.className = "title";
                    span.textContent = selectedProject ? basename(selectedProject) : "";
                    el.appendChild(span);
                    return;
                }
                const back = document.createElement("button");
                back.className = "back";
                back.textContent = "back";
                back.onclick = goHome;
                const proj = document.createElement("span");
                proj.className = "projseg";
                proj.textContent = basename(current.cwd);
                proj.style.color = "var(--faint)";
                const sep = document.createElement("span");
                sep.className = "sep";
                sep.textContent = "/";
                const title = document.createElement("span");
                title.className = "title";
                title.id = "sessionTitle";
                title.textContent = current.draft
                    ? "new session"
                    : current.name || sessionTitle(sessions.find((s) => s.id === current.id) || {});
                if (!current.draft) {
                    title.classList.add("renamable");
                    title.title = "click to rename";
                    title.onclick = startRename;
                }
                el.append(back, proj, sep, title);
            }

            /* Click the breadcrumb title to rename the session (session.rename RPC). */
            function startRename() {
                if (!current || current.draft) return;
                const title = $("sessionTitle");
                const input = document.createElement("input");
                input.className = "rename";
                input.value = current.name || title.textContent;
                title.replaceWith(input);
                input.focus();
                input.select();
                let done = false;
                const finish = async (save) => {
                    if (done) return;
                    done = true;
                    const name = input.value.trim();
                    if (save && name) {
                        try {
                            await rpc("session.rename", { sessionId: current.id, name });
                            current.name = name;
                            const s = sessions.find((x) => x.id === current.id);
                            if (s) s.name = name;
                        } catch (err) {
                            setStatus("rename failed: " + err.message);
                        }
                    }
                    renderCrumb();
                };
                input.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") finish(true);
                    else if (e.key === "Escape") finish(false);
                    e.stopPropagation();
                });
                input.addEventListener("blur", () => finish(false));
            }

            function goHome() {
                if (running) cancelTurn();
                setRoute(null);
                showHome();
            }

            /* ---------- URL routing: /session/<id> so reload/back restore the session ---------- */

            function routedSessionId() {
                const m = location.pathname.match(/^\/session\/([A-Za-z0-9]+)$/);
                if (m) return m[1];
                // Legacy deep links: earlier builds used #s=<id>.
                const h = location.hash.match(/^#s=([A-Za-z0-9]+)/);
                return h ? h[1] : null;
            }
            function setRoute(id) {
                const want = id ? "/session/" + id : "/";
                if (location.pathname === want && !location.hash) return;
                // Real paths — the server serves the app for /session/<id>
                // too; the token query string must survive every navigation.
                history.pushState(null, "", want + location.search);
            }
            function onRoute() {
                const id = routedSessionId();
                if (id) {
                    if (!current || current.id !== id) openSession(id, { fromRoute: true });
                } else if (current) {
                    showHome();
                }
            }
            window.addEventListener("popstate", onRoute);

            /* ---------- boot / home ---------- */

            async function boot() {
                try {
                    serverInfo = await rpc("server.info");
                    const [list, cat, auth] = await Promise.all([
                        rpc("session.list"),
                        rpc("catalog.list"),
                        rpc("auth.status"),
                    ]);
                    sessions = list;
                    catalog = cat;
                    authProviders = auth.providers || [];
                    initModel((current && current.model) || selectedModel || "");
                    $("openPath").value = (serverInfo.defaults && serverInfo.defaults.cwd) || "";
                    $("overlay").classList.add("hidden");
                    if (current && !current.draft) {
                        // Reconnect with a session open: re-attach after the last seq we
                        // saw — the server replays exactly the missed events, so the
                        // transcript catches up in place instead of re-rendering.
                        try {
                            const att = await rpc("session.attach", { sessionId: current.id, afterSeq: lastSeq });
                            if (att.resync) {
                                // Gap outlived the replay ring — full re-render.
                                const id = current.id;
                                current = null;
                                await openSession(id);
                            } else {
                                setRunning(att.running);
                            }
                        } catch {
                            const id = current.id;
                            current = null;
                            await openSession(id);
                        }
                    } else if (!current) {
                        // Fresh load: the URL wins — /session/<id> reopens that session.
                        const routed = routedSessionId();
                        if (routed) openSession(routed);
                        else showHome();
                    }
                    setStatus("");
                } catch (err) {
                    $("overlay").textContent =
                        "failed to connect: " +
                        err.message +
                        (token ? "" : "\n\nno token in URL — open the exact URL `loop serve` printed");
                    $("overlay").classList.remove("hidden");
                }
            }

            async function refreshSessions() {
                try {
                    sessions = await rpc("session.list");
                    renderHome();
                } catch {}
            }

            function projectsOf(list) {
                const map = new Map();
                for (const s of list) {
                    const p = map.get(s.cwd) || { cwd: s.cwd, count: 0, mtime: 0 };
                    p.count++;
                    p.mtime = Math.max(p.mtime, s.mtime);
                    map.set(s.cwd, p);
                }
                return [...map.values()].sort((a, b) => b.mtime - a.mtime);
            }

            function renderHome() {
                if (!$("home").classList.contains("visible")) return;
                const projs = projectsOf(sessions);
                if (selectedProject && !projs.some((p) => p.cwd === selectedProject)) {
                    projs.unshift({ cwd: selectedProject, count: 0, mtime: Date.now() });
                }
                const rail = $("projects");
                rail.innerHTML = "";
                const all = document.createElement("button");
                all.className = "proj" + (selectedProject === null ? " active" : "");
                all.innerHTML =
                    '<span class="avatar" style="background:var(--bg-raise);color:var(--muted)">*</span>' +
                    '<span class="pname">All sessions</span><span class="count">' +
                    sessions.length +
                    "</span>";
                all.onclick = () => {
                    selectedProject = null;
                    renderHome();
                    renderCrumb();
                };
                rail.appendChild(all);
                for (const p of projs) {
                    const hue = hueOf(p.cwd);
                    const btn = document.createElement("button");
                    btn.className = "proj" + (selectedProject === p.cwd ? " active" : "");
                    btn.title = p.cwd;
                    btn.innerHTML =
                        '<span class="avatar" style="background:hsl(' +
                        hue +
                        " 30% 22%);color:hsl(" +
                        hue +
                        ' 70% 72%)">' +
                        esc(basename(p.cwd).slice(0, 2)) +
                        "</span>" +
                        '<span class="pname">' +
                        esc(basename(p.cwd)) +
                        "</span>" +
                        '<span class="count">' +
                        (p.count || "") +
                        "</span>";
                    btn.onclick = () => {
                        selectedProject = p.cwd;
                        renderHome();
                        renderCrumb();
                    };
                    rail.appendChild(btn);
                }
                renderSessionGroups();
            }

            function renderSessionGroups() {
                const q = $("search").value.trim().toLowerCase();
                const el = $("sessionGroups");
                el.innerHTML = "";
                let list = [...sessions].sort((a, b) => b.mtime - a.mtime);
                if (selectedProject) list = list.filter((s) => s.cwd === selectedProject);
                if (q) list = list.filter((s) => (sessionTitle(s) + " " + s.cwd).toLowerCase().includes(q));
                if (!list.length) {
                    el.innerHTML =
                        '<div class="home-empty">' +
                        (sessions.length ? "No sessions match." : "No sessions yet — start one.") +
                        "</div>";
                    return;
                }
                let group = "";
                for (const s of list.slice(0, 200)) {
                    const g = dayGroup(s.mtime);
                    if (g !== group) {
                        group = g;
                        const h = document.createElement("div");
                        h.className = "group-title";
                        h.textContent = g;
                        el.appendChild(h);
                    }
                    const row = document.createElement("button");
                    row.className = "srow";
                    row.innerHTML =
                        (s.running ? '<span class="live" title="turn running"></span>' : "") +
                        '<span class="stitle">' +
                        esc(sessionTitle(s)) +
                        "</span>" +
                        (selectedProject ? "" : '<span class="schip">' + esc(basename(s.cwd)) + "</span>") +
                        '<span class="stime">' +
                        relTime(s.mtime) +
                        "</span>";
                    row.onclick = () => openSession(s.id);
                    el.appendChild(row);
                }
            }

            /* ---------- model picker: provider first, then model (the CLI's flow) ---------- */

            const picker = { stage: "providers", provider: null };

            function availableModels() {
                return catalog.filter((m) => m.available !== false);
            }
            function pickerProviders() {
                const authorized = new Set(authProviders);
                let provs = [...new Set(availableModels().map((m) => m.provider))];
                if (authorized.size) provs = provs.filter((p) => authorized.has(p));
                const curProv = selectedModel.includes("/") ? selectedModel.split("/")[0] : "";
                if (curProv && !provs.includes(curProv)) provs.unshift(curProv);
                return provs.sort();
            }

            function setModel(id) {
                if (!id) return;
                selectedModel = id;
                if (current) current.model = id;
                $("modelBtn").innerHTML = esc(id) + '<span class="chev">&#x25B4;</span>';
            }

            /* Initialize the button from a session's model / the server default. */
            function initModel(desiredModel) {
                const desired =
                    desiredModel ||
                    selectedModel ||
                    (serverInfo && serverInfo.defaults && serverInfo.defaults.model) ||
                    "";
                setModel(desired || (availableModels()[0] || {}).id || "");
            }

            function openPicker() {
                picker.stage = "providers";
                picker.provider = null;
                $("modelPop").classList.add("visible");
                const f = $("modelPop").querySelector(".pfilter");
                f.value = "";
                renderPicker();
                f.focus();
            }
            function closePicker() {
                $("modelPop").classList.remove("visible");
            }

            function renderPicker() {
                const pop = $("modelPop");
                pop.classList.toggle("models", picker.stage === "models");
                const q = pop.querySelector(".pfilter").value.trim().toLowerCase();
                const list = pop.querySelector(".plist");
                list.innerHTML = "";
                const add = (main, meta, cls, onclick) => {
                    const btn = document.createElement("button");
                    btn.className = "pitem " + cls;
                    btn.innerHTML =
                        '<span class="pmain">' + esc(main) + '</span><span class="pmeta">' + esc(meta) + "</span>";
                    btn.onclick = onclick;
                    list.appendChild(btn);
                    return btn;
                };
                if (picker.stage === "providers") {
                    const curProv = selectedModel.split("/")[0];
                    const provs = pickerProviders().filter((p) => !q || p.toLowerCase().includes(q));
                    if (!provs.length) list.innerHTML = '<div class="pempty">no providers match</div>';
                    for (const p of provs) {
                        const count = availableModels().filter((m) => m.provider === p).length;
