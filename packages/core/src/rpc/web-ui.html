                        add(p, count + (count === 1 ? " model" : " models"), p === curProv ? "current" : "", () => {
                            picker.stage = "models";
                            picker.provider = p;
                            const f = $("modelPop").querySelector(".pfilter");
                            f.value = "";
                            renderPicker();
                            f.focus();
                        });
                    }
                } else {
                    const p = picker.provider;
                    let models = availableModels()
                        .filter((m) => m.provider === p)
                        .sort((a, b) => a.id.localeCompare(b.id));
                    // A session model missing from the catalog stays selectable.
                    if (selectedModel.split("/")[0] === p && !models.some((m) => m.id === selectedModel)) {
                        models.unshift({ id: selectedModel, provider: p });
                    }
                    models = models.filter((m) => !q || m.id.toLowerCase().includes(q));
                    if (!models.length) list.innerHTML = '<div class="pempty">no models match</div>';
                    for (const m of models) {
                        const bare = m.id.startsWith(p + "/") ? m.id.slice(p.length + 1) : m.id;
                        const meta = m.cost ? "$" + m.cost.input + "/$" + m.cost.output : "";
                        add(bare, meta, m.id === selectedModel ? "current" : "", () => {
                            setModel(m.id);
                            closePicker();
                            $("input").focus();
                        });
                    }
                }
            }

            /* ---------- transcript rendering ---------- */

            function clearTranscript() {
                blocks.innerHTML = "";
                liveText = null;
                liveReasoning = null;
                toolCards.clear();
                subagentCards.clear();
                clearAttachments();
                promptQueue.length = 0; // queued cards live in #blocks, already wiped above
                $("todos").classList.remove("visible");
                $("cost").textContent = "";
                $("ctx").textContent = "";
                $("scrollDown").classList.remove("visible");
            }

            function scrollDown() {
                const t = $("transcript");
                if (t.scrollHeight - t.scrollTop - t.clientHeight < 160) t.scrollTop = t.scrollHeight;
            }

            function addBlock(cls, html) {
                const div = document.createElement("div");
                div.className = "block " + cls;
                div.innerHTML = html;
                blocks.appendChild(div);
                scrollDown();
                return div;
            }
            function addUser(text) {
                addBlock("user", esc(text));
            }
            function addNote(text) {
                addBlock("note", esc(text));
            }
            function addError(text) {
                addBlock("error", esc(truncate(text)));
            }

            function assistantText() {
                if (!liveText) {
                    const div = addBlock("assistant", '<div class="md"></div><button class="copy-btn">copy</button>');
                    liveText = { el: div.querySelector(".md"), raw: "" };
                }
                return liveText;
            }

            function rowEl(cls, name, summary) {
                const det = document.createElement("details");
                det.className = "row " + cls;
                det.innerHTML =
                    '<summary><span class="chev">&#x203A;</span><span class="tname"></span><span class="tsum"></span></summary>' +
                    '<div class="body"></div>';
                det.querySelector(".tname").textContent = name;
                det.querySelector(".tsum").textContent = summary || "";
                blocks.appendChild(det);
                scrollDown();
                return det;
            }

            function reasoningBox() {
                if (!liveReasoning) {
                    const det = rowEl("reasoning", "thinking", "");
                    const body = det.querySelector(".body");
                    const pre = document.createElement("pre");
                    body.appendChild(pre);
                    liveReasoning = { det, pre, raw: "" };
                }
                return liveReasoning;
            }
            function breakLiveText() {
                liveText = null;
            }
            function breakReasoning() {
                if (liveReasoning) liveReasoning.det.querySelector(".tname").textContent = "thought";
                liveReasoning = null;
            }

            /* One-line summary for a tool call, like the TUI's tool boxes. */
            function toolSummary(name, input) {
                if (!input || typeof input !== "object") return "";
                const i = input;
                if (typeof i.command === "string") return i.command;
                if (typeof i.file_path === "string") return shortPath(i.file_path);
                if (typeof i.path === "string") return shortPath(i.path);
                if (typeof i.pattern === "string") return i.pattern;
                if (typeof i.url === "string") return i.url;
                if (typeof i.query === "string") return i.query;
                const j = pretty(i);
                return j.length > 80 ? j.slice(0, 80) + "…" : j;
            }

            function shortPath(p) {
                // Paths inside the session cwd render relative — the interesting part.
                const cwd = current && current.cwd;
                if (cwd && String(p).startsWith(cwd + "/")) return String(p).slice(cwd.length + 1);
                return String(p);
            }

            function diffHtml(file, oldStr, newStr) {
                const MAXL = 120;
                const lines = (s, cls) =>
                    String(s ?? "")
                        .split("\n")
                        .slice(0, MAXL)
                        .map((l) => '<div class="dl ' + cls + '">' + esc(l) + "</div>")
                        .join("");
                return (
                    '<div class="diff">' +
                    (file ? '<div class="dfile">' + esc(shortPath(file)) + "</div>" : "") +
                    lines(oldStr, "del") +
                    lines(newStr, "add") +
                    "</div>"
                );
            }

            /* Structured body per tool — bash gets a terminal block, edit a diff,
             * write a file preview; everything else keeps the generic input pre. */
            function renderToolInput(card, name, input) {
                const body = card.det.querySelector(".body");
                if (name === "bash" && input && typeof input.command === "string") {
                    body.innerHTML =
                        '<div class="term"><div class="cmd">' +
                        esc(truncate(input.command)) +
                        '</div><div class="out" style="display:none"></div></div>';
                    card.output = body.querySelector(".out");
                    card.mode = "term";
                } else if (name === "edit" && input && typeof input.old_string === "string") {
                    body.innerHTML =
                        diffHtml(input.file_path, input.old_string, input.new_string) +
                        '<pre class="output" style="display:none"></pre>';
                    card.output = body.querySelector(".output");
                    card.mode = "diff";
                } else if (name === "write" && input && typeof input.content === "string") {
                    body.innerHTML =
                        diffHtml(input.file_path, "", input.content) +
                        '<pre class="output" style="display:none"></pre>';
                    card.output = body.querySelector(".output");
                    card.mode = "diff";
                } else {
                    body.innerHTML =
                        '<div class="label">input</div><pre class="input"></pre>' +
                        '<div class="label out-label" style="display:none">result</div><pre class="output" style="display:none"></pre>';
                    card.input = body.querySelector(".input");
                    card.output = body.querySelector(".output");
                    card.outLabel = body.querySelector(".out-label");
                    card.input.textContent = truncate(pretty(input));
                    card.mode = "generic";
                }
            }

            function toolCard(id, name) {
                let card = toolCards.get(id);
                if (!card) {
                    const det = rowEl("tool running", name || "tool", "");
                    const body = det.querySelector(".body");
                    body.innerHTML =
                        '<div class="label">input</div><pre class="input"></pre>' +
                        '<div class="label out-label" style="display:none">result</div><pre class="output" style="display:none"></pre>';
                    card = {
                        det,
                        name: det.querySelector(".tname"),
                        sum: det.querySelector(".tsum"),
                        input: body.querySelector(".input"),
                        output: body.querySelector(".output"),
                        outLabel: body.querySelector(".out-label"),
                        inputRaw: "",
                        mode: "generic",
                        start: Date.now(),
                    };
                    toolCards.set(id, card);
                }
                if (name) card.name.textContent = name;
                return card;
            }
            function finishToolCard(card, output, isError) {
                card.det.classList.remove("running");
                if (isError) card.det.classList.add("error");
                // Elapsed badge on the summary — only meaningful live (history has no timing).
                if (card.start && !card.det.dataset.replay) {
                    const ms = Date.now() - card.start;
                    card.sum.textContent =
                        (card.sum.textContent || "") + "  · " + (ms < 1000 ? ms + "ms" : (ms / 1000).toFixed(1) + "s");
                }
                if (output !== undefined && card.output) {
                    card.output.textContent = truncate(toolOutputText(output));
                    card.output.style.display = "";
                    if (card.outLabel) card.outLabel.style.display = "";
                }
                scrollDown();
            }

            function subagentCard(id, agent) {
                let card = subagentCards.get(id);
                if (!card) {
                    const det = rowEl("subagent running", "task", agent);
                    det.open = true;
                    card = {
                        det,
                        name: det.querySelector(".tname"),
                        sum: det.querySelector(".tsum"),
                        body: det.querySelector(".body"),
                        textEl: null,
                    };
                    subagentCards.set(id, card);
                }
                card.sum.textContent = agent;
                return card;
            }

            function renderEntry(entry) {
                if (entry.type === "message") {
                    const content = entry.content;
                    if (entry.role === "user") {
                        addUser(extractText(content) || "(attachment)");
                    } else if (entry.role === "assistant") {
                        const parts = Array.isArray(content) ? content : [{ type: "text", text: extractText(content) }];
                        for (const p of parts) {
                            if (p.type === "text" && p.text) {
                                addBlock(
                                    "assistant",
                                    '<div class="md">' + md(p.text) + '</div><button class="copy-btn">copy</button>',
                                );
                            } else if (p.type === "reasoning" && p.text) {
                                const det = rowEl("reasoning", "thought", "");
                                const pre = document.createElement("pre");
                                pre.textContent = truncate(p.text);
                                det.querySelector(".body").appendChild(pre);
                            } else if (p.type === "tool-call") {
                                const card = toolCard(p.toolCallId || Math.random(), p.toolName || "tool");
                                card.det.dataset.replay = "1";
                                renderToolInput(card, p.toolName, p.input ?? p.args);
                                card.sum.textContent = toolSummary(p.toolName, p.input ?? p.args);
                                card.det.classList.remove("running");
                            }
                        }
                        if (entry.interrupted) addNote("interrupted");
                    } else if (entry.role === "tool") {
                        const parts = Array.isArray(content) ? content : [];
                        for (const p of parts) {
                            if (p.type !== "tool-result") continue;
                            const card = toolCards.get(p.toolCallId);
                            if (card) finishToolCard(card, p.output ?? p.result, false);
                        }
                    }
                } else if (entry.type === "subagent") {
                    const card = subagentCard(entry.toolCallId || Math.random(), entry.agent);
                    card.det.open = false;
                    card.det.classList.remove("running");
                    card.body.innerHTML =
                        '<div class="label">prompt</div><pre>' +
                        esc(truncate(entry.prompt)) +
                        "</pre>" +
                        '<div class="label">result</div><pre>' +
                        esc(truncate(entry.result)) +
                        "</pre>";
                } else if (entry.type === "compact") {
                    addNote(
                        "compacted: " +
                            Math.round(entry.tokensBefore / 1000) +
                            "k to " +
                            Math.round(entry.tokensAfter / 1000) +
                            "k tokens",
                    );
                } else if (entry.type === "branch-summary") {
                    addNote("branched; abandoned path summarized");
                } else if (entry.type === "model-change") {
                    addNote("model: " + entry.from + " to " + entry.to);
                }
            }

            function extractText(content) {
                if (typeof content === "string") return content;
                if (Array.isArray(content)) {
                    return content
                        .filter((p) => p && p.type === "text" && typeof p.text === "string")
                        .map((p) => p.text)
                        .join("\n");
                }
                return "";
            }

            /* ---------- session lifecycle ---------- */

            async function openSession(id) {
                setRunning(false);
                clearTranscript();
                try {
                    const opened = await rpc("session.open", { sessionId: id });
                    const hist = await rpc("session.history", { sessionId: id });
                    current = {
                        id,
                        model: opened.info.model,
                        name: hist.name || null,
                        cwd: opened.info.cwd,
                        draft: false,
                    };
                    for (const entry of hist.entries || []) renderEntry(entry);
                    breakLiveText();
                    initModel(opened.info.model);
                    setRoute(id);
                    showChat();
                    // Subscribe from the history snapshot's seq: events that fired between
                    // history and here replay in order, none dropped, none doubled. A turn
                    // already running (started by another tab) streams in live.
                    lastSeq = hist.seq || 0;
                    const att = await rpc("session.attach", { sessionId: id, afterSeq: lastSeq });
                    setRunning(att.running);
                    if (att.running) setStatus("working…");
                    refreshCost();
                    $("transcript").scrollTop = $("transcript").scrollHeight;
                } catch (err) {
                    setStatus("open failed: " + err.message);
                    setRoute(null);
                    showHome();
                }
            }

            /* opencode flow: "New session" opens an empty chat; the session is created
             * on the first prompt so abandoned drafts never hit the DB. */
            function newDraft(cwd) {
                setRoute(null);
                lastSeq = 0;
                setRunning(false);
                clearTranscript();
                current = { id: null, model: selectedModel, name: null, cwd, draft: true };
                initModel(selectedModel);
                showChat();
            }

            async function ensureSession() {
                if (!current.draft) return;
                const model = selectedModel;
                const provider = (catalog.find((m) => m.id === model) || {}).provider || model.split("/")[0];
                const r = await rpc("session.create", { cwd: current.cwd, model, provider });
                current.id = r.sessionId;
                current.draft = false;
                setRoute(current.id);
            }

            /* Messages typed while a turn runs queue up (dashed cards) and auto-send
             * as turns finish — same flow as typing ahead in the TUI. */
            const promptQueue = []; // { input, images, label, el }

            function sendPrompt() {
                const input = $("input").value.trim();
                if ((!input && !attachments.length) || !current) return;
                const images = attachments.map((a) => ({ data: a.data, mediaType: a.mediaType }));
                const label =
                    input +
                    (attachments.length
                        ? "\n(" + attachments.length + " image" + (attachments.length > 1 ? "s" : "") + " attached)"
                        : "");
                clearAttachments();
                $("input").value = "";
                $("input").style.height = "auto";
                if (running) {
                    enqueuePrompt(input, images, label);
                    return;
                }
                void doSend(input, images, label);
            }

            function enqueuePrompt(input, images, label) {
                const div = document.createElement("div");
                div.className = "block user queued";
                div.innerHTML =
                    '<button class="qremove" title="remove from queue">x</button><span class="qtag">queued</span>';
                div.appendChild(document.createTextNode(label));
                const item = { input, images, label, el: div };
                div.querySelector(".qremove").onclick = () => {
                    const idx = promptQueue.indexOf(item);
                    if (idx >= 0) promptQueue.splice(idx, 1);
                    div.remove();
                };
                blocks.appendChild(div);
                promptQueue.push(item);
                setStatus("working… (" + promptQueue.length + " queued)");
                scrollDown();
            }

            function drainQueue() {
                if (running || !promptQueue.length || !current) return;
                const item = promptQueue.shift();
                item.el.remove();
                void doSend(item.input, item.images, item.label);
            }

            async function doSend(input, images, label) {
                addUser(label);
                breakLiveText();
                breakReasoning();
                setRunning(true);
                setStatus("working…");
                try {
                    await ensureSession();
                    renderCrumb();
                    await rpc("session.send", {
                        sessionId: current.id,
                        input,
                        model: selectedModel || current.model,
                        images: images.length ? images : undefined,
                        thinking: $("thinkSel").value || undefined,
                    });
                } catch (err) {
                    setRunning(false);
                    addError("send failed: " + err.message);
                    drainQueue();
                }
            }

            /* ---------- image attachments (drag-and-drop + paste, like the CLI) ---------- */

            const attachments = []; // { data: base64, mediaType, url: objectURL }
            const IMAGE_TYPES = new Set(["image/png", "image/jpeg", "image/gif", "image/webp", "image/bmp"]);

            function renderAttachments() {
                const el = $("attachments");
                el.classList.toggle("visible", attachments.length > 0);
                el.innerHTML = "";
                attachments.forEach((a, idx) => {
                    const div = document.createElement("div");
                    div.className = "att";
                    const img = document.createElement("img");
                    img.src = a.url;
                    const rm = document.createElement("button");
                    rm.textContent = "x";
                    rm.title = "remove";
                    rm.onclick = () => {
                        URL.revokeObjectURL(a.url);
                        attachments.splice(idx, 1);
                        renderAttachments();
                    };
                    div.append(img, rm);
                    el.appendChild(div);
                });
            }
            function clearAttachments() {
                for (const a of attachments) URL.revokeObjectURL(a.url);
                attachments.length = 0;
                renderAttachments();
            }
            function attachFile(file) {
                if (!file || !IMAGE_TYPES.has(file.type) || attachments.length >= 8) return;
                const reader = new FileReader();
                reader.onload = () => {
                    const dataUrl = String(reader.result);
                    const data = dataUrl.slice(dataUrl.indexOf(",") + 1);
                    attachments.push({ data, mediaType: file.type, url: URL.createObjectURL(file) });
                    renderAttachments();
                };
                reader.readAsDataURL(file);
            }

            async function cancelTurn() {
                if (!current || !current.id) return;
                try {
                    await rpc("session.cancel", { sessionId: current.id });
                } catch {}
            }

            async function refreshCost() {
                if (!current || !current.id) return;
                try {
                    const c = await rpc("cost.session", { sessionId: current.id });
                    if (c && typeof c.usd === "number" && c.usd > 0) {
                        $("cost").textContent = (c.estimated ? "~" : "") + "$" + c.usd.toFixed(4);
                    }
                } catch {}
            }

            /* ---------- live events ---------- */

            function onEvent(params) {
                if (!params || !current || params.sessionId !== current.id) return;
                // Seq guard: replayed + live streams are both monotonic; anything at or
                // below what we've applied is a duplicate (e.g. racing attach calls).
                if (typeof params.seq === "number") {
                    if (params.seq <= lastSeq) return;
                    lastSeq = params.seq;
                }
                const { type, data } = params.part || {};
                switch (type) {
                    case "text-delta": {
                        const t = assistantText();
                        t.raw += data;
                        t.el.innerHTML = md(t.raw);
                        scrollDown();
                        break;
                    }
                    case "reasoning-start":
                        breakLiveText();
                        reasoningBox();
                        break;
                    case "reasoning-delta": {
                        breakLiveText();
                        const r = reasoningBox();
                        r.raw += data;
                        r.pre.textContent = truncate(r.raw);
                        scrollDown();
                        break;
                    }
                    case "reasoning-end":
                        breakReasoning();
                        break;
                    case "tool-input-start":
                        breakLiveText();
                        breakReasoning();
                        if (data && data.toolCallId) toolCard(data.toolCallId, data.toolName);
                        break;
                    case "tool-input-delta": {
                        if (data && data.toolCallId) {
                            const card = toolCards.get(data.toolCallId);
                            // Stream raw JSON into the generic pre; structured modes
                            // re-render on the full tool-call anyway.
                            if (card && card.mode === "generic" && card.input && card.inputRaw.length < TRUNCATE) {
                                card.inputRaw += data.delta;
                                card.input.textContent = truncate(card.inputRaw);
                            }
                        }
                        break;
                    }
                    case "tool-call": {
                        breakLiveText();
                        breakReasoning();
                        const card = toolCard((data && data.toolCallId) || Math.random(), data && data.toolName);
                        renderToolInput(card, data && data.toolName, data && data.input);
                        card.sum.textContent = toolSummary(data && data.toolName, data && data.input);
                        setStatus(((data && data.toolName) || "tool") + "…");
                        break;
                    }
                    case "tool-result": {
                        const card = data && toolCards.get(data.toolCallId);
                        if (card) finishToolCard(card, data.output, false);
                        setStatus("working…");
                        break;
                    }
                    case "tool-error": {
                        const card = data && data.toolCallId && toolCards.get(data.toolCallId);
                        if (card) finishToolCard(card, data.error, true);
                        else addError("tool error: " + pretty(data && data.error));
                        break;
                    }
                    case "subagent-delta": {
                        const card = subagentCard(data.toolCallId, data.agent);
                        if (!card.textEl) {
                            card.textEl = document.createElement("div");
                            card.textEl.className = "line text";
                            card.body.appendChild(card.textEl);
                        }
                        card.textEl.textContent = truncate((card.textEl.textContent || "") + data.text);
                        break;
                    }
                    case "subagent-tool": {
                        const card = subagentCard(data.toolCallId, data.agent);
                        const line = document.createElement("div");
                        line.className = "line";
                        line.textContent = data.toolName || "tool";
                        card.body.appendChild(line);
                        card.textEl = null;
                        break;
                    }
                    case "subagent-step-usage": {
                        const card = subagentCards.get(data.toolCallId);
                        if (card && data.steps) {
                            card.sum.textContent =
                                data.agent + " · step " + data.steps + (data.usd ? " · $" + data.usd.toFixed(4) : "");
                        }
                        break;
                    }
                    case "subagent-finish": {
                        const card = subagentCards.get(data.toolCallId);
                        if (card) {
                            card.det.open = false;
                            card.det.classList.remove("running");
                        }
                        break;
                    }
                    case "step-usage":
                        if (data && data.breakdown && typeof data.breakdown.usd === "number") {
                            $("cost").textContent =
                                (data.breakdown.estimated ? "~" : "") + "$" + data.breakdown.usd.toFixed(4);
                        }
                        if (data && data.usage) {
                            const u = data.usage;
                            const ctx =
                                u.totalTokens ??
                                (u.inputTokens || 0) + (u.outputTokens || 0) + (u.cachedInputTokens || 0);
                            if (ctx > 0) $("ctx").textContent = "ctx " + fmtTok(ctx);
                        }
                        break;
                    case "compact-start":
                        addNote("compacting…");
                        break;
                    case "compact-end":
                        addNote("compacted");
                        break;
                    case "todo-update": {
                        const el = $("todos");
                        const items = (data && data.items) || [];
                        el.classList.toggle("visible", items.length > 0);
                        el.innerHTML = items
                            .map(
                                (i) =>
                                    '<div class="' +
                                    (i.status === "completed" ? "done" : "") +
                                    '">' +
                                    "[" +
                                    (i.status === "completed" ? "x" : i.status === "in_progress" ? ">" : " ") +
                                    "] " +
                                    esc(i.content || i.subject || "") +
                                    "</div>",
                            )
                            .join("");
                        break;
                    }
                    case "attached-images":
                        if (Array.isArray(data) && data.length) {
                            addNote("attached " + data.length + " image" + (data.length > 1 ? "s" : ""));
                        }
                        break;
                    case "hook-message":
                        addNote(String(data));
                        break;
                    case "data-recap":
                        if (data && data.text) addNote("recap: " + data.text);
                        break;
                    case "error":
                        addError(pretty(data));
                        setRunning(false);
                        drainQueue();
                        break;
                    case "finish": {
                        breakLiveText();
                        breakReasoning();
                        setRunning(false);
                        // First prompt names the session; refresh titles quietly.
                        rpc("session.list")
                            .then((l) => {
                                sessions = l;
                                renderCrumb();
                            })
                            .catch(() => {});
                        drainQueue();
                        break;
                    }
                    default:
                        break;
                }
            }

            /* ---------- dialogs: usage (steak + cost) and settings ---------- */

            function openDialog(title) {
                $("dialogTitle").textContent = title;
                $("dialogBody").innerHTML = '<div style="color:var(--faint)">loading…</div>';
                $("dialogWrap").classList.add("visible");
            }
            function closeDialog() {
                $("dialogWrap").classList.remove("visible");
            }

            function fmtTok(n) {
                if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
                if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
                if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
                return String(n);
            }

            async function showUsage() {
                openDialog("Usage");
                try {
                    const [grid, stats, session] = await Promise.all([
                        rpc("usage.steak"),
                        rpc("cost.stats", { cwd: (current && current.cwd) || selectedProject || undefined }),
                        current && current.id ? rpc("cost.session", { sessionId: current.id }) : Promise.resolve(null),
                    ]);
                    const body = $("dialogBody");
                    body.innerHTML = "";

                    // Dates per cell: startDay is the grid's column-0 Sunday (local).
                    const startParts = String(grid.startDay || "")
                        .split("-")
                        .map(Number);
                    const dateAt = (c, r) => {
                        const d = new Date(startParts[0], (startParts[1] || 1) - 1, startParts[2] || 1);
                        d.setDate(d.getDate() + c * 7 + r);
                        return d;
                    };
                    const fmtDay = (d) =>
                        d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });

                    // Streak stats from the raw token matrix, walked in date order.
                    const seq = [];
                    for (let c = 0; c < grid.weeks; c++) {
                        for (let r = 0; r < 7; r++) {
                            const t = grid.tokens && grid.tokens[r] ? grid.tokens[r][c] : -1;
                            if (t >= 0) seq.push({ c, r, tok: t });
                        }
                    }
                    let longest = 0,
                        run = 0,
                        activeDays = 0,
                        best = null;
                    for (const d of seq) {
                        if (d.tok > 0) {
                            run++;
                            activeDays++;
                            if (run > longest) longest = run;
                            if (!best || d.tok > best.tok) best = d;
                        } else run = 0;
                    }
                    // Current streak: trailing run of active days; a quiet "today" doesn't
                    // break it yet (the day isn't over).
                    let currentStreak = 0;
                    let i = seq.length - 1;
                    if (i >= 0 && seq[i].tok === 0) i--;
                    for (; i >= 0 && seq[i].tok > 0; i--) currentStreak++;

                    const steakHead = document.createElement("div");
                    steakHead.className = "steak-head";
                    steakHead.innerHTML =
                        '<span class="steak-total">' +
                        esc(fmtTok(grid.totalTokens)) +
                        " tokens</span>" +
                        '<span class="steak-sub">in the last year</span>';
                    body.appendChild(steakHead);

                    const scroll = document.createElement("div");
                    scroll.className = "steak-scroll";
                    const months = document.createElement("div");
                    months.className = "steak-months";
                    months.style.gridTemplateColumns = "repeat(" + grid.weeks + ", 12px)";
                    for (const lbl of grid.monthLabels) {
                        const s = document.createElement("span");
                        s.textContent = lbl;
                        s.style.overflow = "visible";
                        s.style.whiteSpace = "nowrap";
                        months.appendChild(s);
                    }
                    const wrap = document.createElement("div");
                    wrap.className = "steak-grid";
                    const days = document.createElement("div");
                    days.className = "steak-days";
                    ["", "Mon", "", "Wed", "", "Fri", ""].forEach((d) => {
                        const s = document.createElement("span");
                        s.textContent = d;
                        days.appendChild(s);
                    });
                    const cols = document.createElement("div");
                    cols.className = "steak-cols";
                    for (let c = 0; c < grid.weeks; c++) {
                        const col = document.createElement("div");
                        col.className = "steak-col";
                        for (let r = 0; r < 7; r++) {
                            const lvl = grid.cells[r][c];
                            const cell = document.createElement("div");
                            cell.className = "cell " + (lvl < 0 ? "lv-b" : "lv-" + lvl);
                            if (lvl >= 0) {
                                const tok = grid.tokens && grid.tokens[r] ? grid.tokens[r][c] : 0;
                                cell.title =
                                    fmtDay(dateAt(c, r)) + " — " + (tok > 0 ? fmtTok(tok) + " tokens" : "no usage");
                            }
                            col.appendChild(cell);
                        }
                        cols.appendChild(col);
                    }
                    wrap.append(days, cols);
                    scroll.append(months, wrap);
                    body.appendChild(scroll);

                    const legend = document.createElement("div");
                    legend.className = "steak-legend";
                    legend.innerHTML =
                        'Less <div class="cell lv-0"></div><div class="cell lv-1"></div><div class="cell lv-2"></div><div class="cell lv-3"></div><div class="cell lv-4"></div> More';
                    body.appendChild(legend);

                    const statTiles = document.createElement("div");
                    statTiles.className = "stat-row";
                    const tile = (val, name, note) =>
                        '<div class="stat"><div class="sval">' +
                        esc(val) +
                        '</div><div class="sname">' +
                        esc(name) +
                        (note ? ' <span class="snote">' + esc(note) + "</span>" : "") +
                        "</div></div>";
                    statTiles.innerHTML =
                        tile(currentStreak + (currentStreak === 1 ? " day" : " days"), "current streak") +
                        tile(longest + (longest === 1 ? " day" : " days"), "longest streak") +
                        tile(String(activeDays), "active days") +
                        tile(best ? fmtTok(best.tok) : "0", "busiest day", best ? fmtDay(dateAt(best.c, best.r)) : "");
                    body.appendChild(statTiles);

                    // Cost table, same rows as the CLI's /cost.
                    const table = document.createElement("div");
                    table.className = "cost-table";
                    const head = document.createElement("div");
                    head.className = "cost-head";
                    head.textContent = "Cost";
                    table.appendChild(head);
                    const usd = (v) => "$" + (v || 0).toFixed(4);
                    const row = (label, val, extra, sub) => {
                        const div = document.createElement("div");
                        div.className = "cost-row" + (sub ? " sub" : "");
                        div.innerHTML =
                            '<span class="clabel">' +
                            esc(label) +
                            '</span><span class="cval">' +
                            esc(val) +
                            '</span><span class="cextra">' +
                            esc(extra || "") +
                            "</span>";
                        table.appendChild(div);
                    };
                    if (session && typeof session.usd === "number") {
                        row(
                            "session",
                            (session.estimated ? "~" : "") + usd(session.usd),
                            "in:" +
                                fmtTok(session.inputTokens) +
                                " out:" +
                                fmtTok(session.outputTokens) +
                                " cache:" +
                                fmtTok(session.cachedInputTokens),
                        );
                    }
                    const projCwd = (current && current.cwd) || selectedProject;
                    if (projCwd) row("project", usd(stats.cwdUsd), projCwd);
                    row("today", usd(stats.todayUsd));
                    row("last 7 days", usd(stats.last7Usd));
                    row("this month", usd(stats.monthUsd));
                    row("lifetime", usd(stats.lifetimeUsd));
                    const provs = Object.entries(stats.byProvider || {})
                        .filter(([, v]) => v > 0)
                        .sort((a, b) => b[1] - a[1]);
                    for (const [p, v] of provs) row(p, usd(v), "", true);
                    body.appendChild(table);

                    // Scroll the heatmap to the present (right edge).
                    scroll.scrollLeft = scroll.scrollWidth;
                } catch (err) {
                    $("dialogBody").innerHTML =
                        '<div class="block error">' + esc("failed to load usage: " + err.message) + "</div>";
                }
            }

            async function showSettings() {
                openDialog("Settings");
                try {
                    const list = await rpc("settings.list");
                    const body = $("dialogBody");
                    body.innerHTML = "";
                    for (const s of list) {
                        const btn = document.createElement("button");
                        btn.className = "set-row" + (s.value ? " on" : "");
                        btn.innerHTML =
                            '<span class="smain"><div class="slabel">' +
                            esc(s.label) +
                            '</div><div class="sdesc">' +
                            esc(s.description) +
                            "</div></span>" +
                            '<span class="toggle"></span>';
                        btn.onclick = async () => {
                            const next = !btn.classList.contains("on");
                            btn.classList.toggle("on", next);
                            try {
                                await rpc("settings.set", { key: s.key, value: next });
                            } catch (err) {
                                btn.classList.toggle("on", !next); // revert on failure
                                setStatus("settings: " + err.message);
                            }
                        };
                        body.appendChild(btn);
                    }
                } catch (err) {
                    $("dialogBody").innerHTML =
                        '<div class="block error">' + esc("failed to load settings: " + err.message) + "</div>";
                }
            }

            /* Context breakdown — the /context view: what fills the model's window.
             * Works for drafts too (fixed overhead a new session would start with). */
            const CTX_COLORS = {
                systemPrompt: "#e5c07b",
                extensionPrompt: "#d19a66",
                systemTools: "#61afef",
                mcpTools: "#c678dd",
                workspaceContext: "#56b6c2",
                memory: "#98c379",
                skills: "#e06c75",
                messages: "#ff8648",
                compactSummary: "#f6c251",
            };

            async function showContext() {
                if (!current) return;
                openDialog("Context");
                try {
                    const report = await rpc(
                        "context.report",
                        current.draft
                            ? { cwd: current.cwd, model: selectedModel || current.model }
                            : { sessionId: current.id },
                    );
                    const body = $("dialogBody");
                    body.innerHTML = "";

                    const win = report.contextWindow || 0;
                    const used = report.totalTokens || 0;
                    const pct = win > 0 ? Math.min(100, (used / win) * 100) : 0;

                    const head = document.createElement("div");
                    head.className = "ctx-head";
                    head.innerHTML =
                        '<span class="chl">' +
                        esc(fmtTok(used)) +
                        (win > 0 ? " / " + esc(fmtTok(win)) : "") +
                        " tokens" +
                        (win > 0 ? " (" + pct.toFixed(1) + "%)" : "") +
                        "</span>" +
                        '<span class="chm">' +
                        esc(report.modelId || "") +
                        "</span>";
                    body.appendChild(head);

                    if (win > 0) {
                        const bar = document.createElement("div");
                        bar.className = "ctx-bar";
                        for (const c of report.categories) {
                            if (!c.tokens) continue;
                            const seg = document.createElement("div");
                            seg.className = "seg";
                            seg.style.width = Math.max(0.4, (c.tokens / win) * 100) + "%";
                            seg.style.background = CTX_COLORS[c.key] || "var(--muted)";
                            seg.title = c.label + " — " + fmtTok(c.tokens);
                            bar.appendChild(seg);
                        }
                        if (report.autoCompactThreshold > 0 && report.autoCompactThreshold < 1) {
                            const mark = document.createElement("div");
                            mark.className = "compact-mark";
                            mark.style.left = report.autoCompactThreshold * 100 + "%";
                            mark.title = "auto-compact at " + Math.round(report.autoCompactThreshold * 100) + "%";
                            bar.appendChild(mark);
                        }
                        body.appendChild(bar);
                        if (report.autoCompactThreshold > 0 && report.autoCompactThreshold < 1) {
                            const note = document.createElement("div");
                            note.className = "ctx-marknote";
                            note.textContent =
                                "auto-compacts at " + Math.round(report.autoCompactThreshold * 100) + "% of the window";
                            body.appendChild(note);
                        }
                    }

                    const row = (dotColor, label, tokens, cls) => {
                        const div = document.createElement("div");
                        div.className = "ctx-row" + (cls ? " " + cls : "");
                        div.innerHTML =
                            '<span class="dot" style="background:' +
                            dotColor +
                            '"></span>' +
                            '<span class="clabel">' +
                            esc(label) +
                            "</span>" +
                            '<span class="ctok">' +
                            esc(fmtTok(tokens)) +
                            "</span>" +
                            '<span class="cpct">' +
                            (win > 0 ? ((tokens / win) * 100).toFixed(1) + "%" : "") +
                            "</span>";
                        body.appendChild(div);
                    };
                    for (const c of report.categories) {
                        let label = c.label;
                        if (c.key === "systemTools" && report.toolCount) label += " (" + report.toolCount + ")";
                        if (c.key === "mcpTools" && report.mcpToolCount) label += " (" + report.mcpToolCount + ")";
                        row(CTX_COLORS[c.key] || "var(--muted)", label, c.tokens);
                    }
                    if (win > 0) row("var(--bg-raise)", "Free space", report.freeTokens, "free");

                    if (report.skills && report.skills.length) {
                        const sk = document.createElement("div");
                        sk.className = "ctx-skills";
                        sk.innerHTML = '<div class="cost-head">Skills (' + report.skills.length + ")</div>";
                        body.appendChild(sk);
                        for (const s of report.skills.slice(0, 20)) {
                            const div = document.createElement("div");
                            div.className = "cost-row sub";
                            div.innerHTML =
                                '<span class="clabel">' +
                                esc(s.name) +
                                '</span><span class="cval">' +
                                esc(fmtTok(s.tokens)) +
                                '</span><span class="cextra"></span>';
                            sk.appendChild(div);
                        }
                    }

                    const note = document.createElement("div");
                    note.className = "ctx-marknote";
                    note.style.marginTop = "12px";
                    note.textContent =
                        "estimates (chars/4)" +
                        (current.draft ? " — draft session: fixed overhead only, no messages yet" : "");
                    body.appendChild(note);
                } catch (err) {
                    $("dialogBody").innerHTML =
                        '<div class="block error">' + esc("failed to load context report: " + err.message) + "</div>";
                }
            }

            /* Extensions — list built-in + installed, enable/disable in place.
             * Install/uninstall stay in the CLI (a remote page must not pull code). */
            async function showExtensions() {
                openDialog("Extensions");
                try {
                    const list = await rpc("extension.list");
                    const body = $("dialogBody");
                    body.innerHTML = "";
                    if (!list.length) {
                        body.innerHTML =
                            '<div class="home-empty">No extensions. Install one from the CLI: /install &lt;npm|github:owner/repo|path&gt;</div>';
                        return;
                    }
                    for (const e of list) {
                        const btn = document.createElement("button");
                        btn.className = "set-row" + (e.enabled ? " on" : "");
                        const badge = e.builtin ? "built-in" : e.version ? "v" + e.version : "installed";
                        const desc = e.description || (e.linkPath ? "linked: " + e.linkPath : e.source || "");
                        btn.innerHTML =
                            '<span class="smain"><div class="slabel">' +
                            esc(e.displayName || e.name) +
                            "</div>" +
                            '<div class="sdesc">' +
                            esc(desc) +
                            "</div></span>" +
                            '<span class="sbadge">' +
                            esc(badge) +
                            "</span>" +
                            '<span class="toggle"></span>';
                        btn.onclick = async () => {
                            const next = !btn.classList.contains("on");
                            btn.classList.toggle("on", next);
                            btn.disabled = true;
                            try {
                                await rpc("extension.setEnabled", { name: e.name, value: next });
                            } catch (err) {
                                btn.classList.toggle("on", !next); // revert on failure
                                setStatus("extensions: " + err.message);
                            } finally {
                                btn.disabled = false;
                            }
                        };
                        body.appendChild(btn);
                    }
                    const note = document.createElement("div");
                    note.className = "ctx-marknote";
                    note.style.marginTop = "12px";
                    note.textContent =
                        "toggles apply to new turns; freshly enabled slash commands need a server restart";
                    body.appendChild(note);
                } catch (err) {
                    $("dialogBody").innerHTML =
                        '<div class="block error">' + esc("failed to load extensions: " + err.message) + "</div>";
                }
            }

            /* ---------- wiring ---------- */

            /* Start a draft in the most relevant project: the open session's, the
             * selected one, the most recent, or the server's cwd. Reachable from
             * anywhere via the header button (closes any open dialog first). */
            function startNewSession() {
                closeDialog();
                const cwd =
                    (current && current.cwd) ||
                    selectedProject ||
                    (projectsOf(sessions)[0] || {}).cwd ||
                    (serverInfo && serverInfo.defaults && serverInfo.defaults.cwd);
                if (!cwd) {
                    showHome();
                    $("openProject").click();
                    return;
                }
                newDraft(cwd);
            }
            $("newSession").onclick = startNewSession;
            $("headerNew").onclick = startNewSession;
            $("openProject").onclick = () => {
                $("openForm").classList.toggle("visible");
                $("openPath").focus();
            };
            $("openPath").addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    const p = $("openPath").value.trim();
                    if (p) {
                        selectedProject = p;
                        $("openForm").classList.remove("visible");
                        renderHome();
                        newDraft(p);
                    }
                } else if (e.key === "Escape") {
                    $("openForm").classList.remove("visible");
                }
            });
            $("search").addEventListener("input", renderSessionGroups);
            $("modelBtn").onclick = (e) => {
                e.stopPropagation();
                if ($("modelPop").classList.contains("visible")) closePicker();
                else openPicker();
            };
            $("modelPop").addEventListener("click", (e) => e.stopPropagation());
            $("modelPop").querySelector(".pback").onclick = () => {
                picker.stage = "providers";
                const f = $("modelPop").querySelector(".pfilter");
                f.value = "";
                renderPicker();
                f.focus();
            };
            $("modelPop").querySelector(".pfilter").addEventListener("input", renderPicker);
            $("modelPop")
                .querySelector(".pfilter")
                .addEventListener("keydown", (e) => {
                    if (e.key === "Escape") {
                        closePicker();
                        $("input").focus();
                    } else if (e.key === "Enter") {
                        const first = $("modelPop").querySelector(".plist .pitem");
                        if (first) first.click();
                    } else if (e.key === "Backspace" && !e.target.value && picker.stage === "models") {
                        $("modelPop").querySelector(".pback").click();
                    }
                });
            document.addEventListener("click", () => closePicker());
            $("usageBtn").onclick = showUsage;
            $("extBtn").onclick = showExtensions;
            $("settingsBtn").onclick = showSettings;
            $("ctxBtn").onclick = showContext;
            $("ctx").onclick = showContext;

            /* Compact: server-side summarize, then re-render from the new history.
             * The wait is a real model call — make it unmissable: pulsing yellow button,
             * a note in the transcript, and the composer in its busy state. */
            $("compactBtn").onclick = async () => {
                if (!current || !current.id || running) return;
                const btn = $("compactBtn");
                btn.disabled = true;
                btn.classList.add("busy");
                btn.textContent = "compacting…";
                addNote("compacting — summarizing older turns (takes a few seconds)…");
                setRunning(true);
                setStatus("compacting…");
                try {
                    await rpc("session.compact", { sessionId: current.id });
                    const id = current.id;
                    current = null;
                    await openSession(id);
                    addNote("compacted");
                } catch (err) {
                    addError("compact failed: " + err.message);
                } finally {
                    btn.disabled = false;
                    btn.classList.remove("busy");
                    btn.textContent = "compact";
                    setRunning(false);
                    drainQueue();
                }
            };

            /* Expand / collapse every tool, reasoning, and subagent row at once. */
            let toolsExpanded = false;
            $("toggleTools").onclick = () => {
                toolsExpanded = !toolsExpanded;
                for (const det of blocks.querySelectorAll("details.row")) det.open = toolsExpanded;
                $("toggleTools").textContent = toolsExpanded ? "collapse tools" : "expand tools";
            };

            /* Floating jump-to-latest button when scrolled up. */
            $("transcript").addEventListener("scroll", function () {
                const away = this.scrollHeight - this.scrollTop - this.clientHeight;
                $("scrollDown").classList.toggle("visible", away > 300);
            });
            $("scrollDown").onclick = () => {
                const t = $("transcript");
                t.scrollTop = t.scrollHeight;
            };

            /* Copy buttons (event delegation — blocks re-render constantly). */
            blocks.addEventListener("click", async (e) => {
                const btn = e.target.closest(".copy-btn");
                if (!btn) return;
                const wrap = btn.closest(".codewrap");
                const text = wrap
                    ? wrap.querySelector("pre").innerText
                    : (btn.closest(".block.assistant") || {}).innerText || "";
                try {
                    await navigator.clipboard.writeText(text.replace(/\ncopy$/, ""));
                    btn.textContent = "copied";
                    setTimeout(() => {
                        btn.textContent = "copy";
                    }, 1200);
                } catch {
                    btn.textContent = "copy failed";
                }
            });
            $("dialogWrap").addEventListener("click", (e) => {
                if (e.target === $("dialogWrap")) closeDialog();
            });
            $("dialog").querySelector(".dclose").onclick = closeDialog;
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && $("dialogWrap").classList.contains("visible")) closeDialog();
            });
            $("send").onclick = sendPrompt;
            $("stop").onclick = cancelTurn;
            /* Touch keyboards have no Shift+Enter: there, Enter makes a newline and the
             * send button submits (messenger convention). Desktop keeps Enter-to-send. */
            const coarsePointer = matchMedia("(pointer: coarse)").matches;
            if (coarsePointer) $("input").placeholder = "Ask anything";
            $("input").addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey && !coarsePointer) {
                    e.preventDefault();
                    sendPrompt();
                } else if (e.key === "Escape") {
                    if (running) cancelTurn();
                    else goHome();
                }
            });
            $("attachBtn").onclick = () => $("fileInput").click();
            $("fileInput").addEventListener("change", function () {
                for (const file of this.files || []) attachFile(file);
                this.value = ""; // same file re-attachable
                $("input").focus();
            });
            $("input").addEventListener("input", function () {
                this.style.height = "auto";
                this.style.height = Math.min(this.scrollHeight, 240) + "px";
            });

            /* Paste an image anywhere in the composer. */
            $("input").addEventListener("paste", (e) => {
                const items = (e.clipboardData && e.clipboardData.items) || [];
                for (const item of items) {
                    if (item.kind === "file" && IMAGE_TYPES.has(item.type)) {
                        e.preventDefault();
                        attachFile(item.getAsFile());
                    }
                }
            });

            /* Drag-and-drop: as soon as a file drag enters the window (chat open), the
             * whole viewport becomes a labeled drop target and the composer highlights.
             * Window-level listeners + a single overlay avoid the classic enter/leave
             * flicker as the drag crosses child elements. */
            function isFileDrag(e) {
                const types = (e.dataTransfer && e.dataTransfer.types) || [];
                return [...types].includes("Files");
            }
            function showDropZone(on) {
                $("dropZone").classList.toggle("visible", on);
                $("composer").classList.toggle("dragging", on);
            }
            window.addEventListener("dragenter", (e) => {
                if (!isFileDrag(e) || !$("chat").classList.contains("visible")) return;
                e.preventDefault();
                showDropZone(true);
            });
            window.addEventListener("dragover", (e) => {
                if (!isFileDrag(e)) return;
                e.preventDefault();
            });
            /* Leaving the window: dragleave with no related target (or out-of-viewport). */
            window.addEventListener("dragleave", (e) => {
                if (
                    e.relatedTarget === null &&
                    (e.clientX <= 0 ||
                        e.clientY <= 0 ||
                        e.clientX >= innerWidth ||
                        e.clientY >= innerHeight ||
                        (e.clientX === 0 && e.clientY === 0))
                ) {
                    showDropZone(false);
                }
            });
            window.addEventListener("drop", (e) => {
                e.preventDefault();
                showDropZone(false);
                if (!$("chat").classList.contains("visible")) return;
                for (const file of (e.dataTransfer && e.dataTransfer.files) || []) attachFile(file);
                $("input").focus();
            });
            /* Esc also dismisses a stuck overlay (cancelled OS drag). */
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") showDropZone(false);
            });

            /* Keep home's running-dots and previews fresh (cheap DB list). */
            setInterval(() => {
                if (connected && $("home").classList.contains("visible")) refreshSessions();
            }, 5000);

            connect();
        </script>
    </body>
</html>
